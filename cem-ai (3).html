<!doctype html>
<html lang="de" data-tema="dark" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEM AI</title>
<style>
:root{--acc:#7c5cff;--acc2:#ff6bd6}
html[data-tema=dark]{--bg:#16161d;--side:#101016;--panel:#23232d;--text:#ececf1;--mut:#8e8ea0;--line:#2e2e3a;--hover:#1f1f29;--code:#0c0c11}
html[data-tema=light]{--bg:#ffffff;--side:#f5f5f9;--panel:#f0f0f6;--text:#1a1a22;--mut:#6b6b7a;--line:#e2e2ea;--hover:#e9e9f1;--code:#f3f3f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit}
svg{display:block;flex-shrink:0}
#app{display:flex;height:100%}
#side{width:270px;background:var(--side);display:flex;flex-direction:column;padding:10px;gap:8px;flex-shrink:0;border-right:1px solid var(--line)}
body.kapali #side{display:none}
.marka{display:flex;align-items:center;gap:10px;padding:4px 6px;font-weight:700;font-size:17px}
.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.sbtn{background:none;border:1px solid var(--line);padding:9px 12px;border-radius:12px;cursor:pointer;text-align:left;font-size:15px;display:flex;align-items:center;gap:10px}
.sbtn:hover{background:var(--hover)}
#ara{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--text);font:inherit;font-size:14px;outline:0;width:100%}
#liste{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.it{padding:8px 8px 8px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px}
.it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it:hover,.it.on{background:var(--hover)}
.dots{background:none;border:0;color:var(--mut);cursor:pointer;opacity:0;font-size:18px;line-height:1;padding:2px 8px;border-radius:6px}
.it:hover .dots,.it.on .dots{opacity:1}
@media(hover:none){.dots{opacity:1}}
#durum{font-size:12px;color:var(--mut);padding:2px 6px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#ust{padding:10px 14px;display:flex;align-items:center;gap:8px}
.ibtn{background:none;border:0;cursor:pointer;padding:8px;border-radius:10px;color:var(--text);display:flex}
.ibtn:hover{background:var(--hover)}
#modb{background:none;border:0;cursor:pointer;font-size:17px;font-weight:700;padding:6px 10px;border-radius:10px;display:flex;align-items:center;gap:6px}
#modb:hover{background:var(--hover)}
#modb small{font-weight:500;color:var(--mut);font-size:13px}
#mesajlar{flex:1;overflow:auto;padding:6px 0;display:flex;flex-direction:column}
.satir{width:100%;max-width:780px;margin:0 auto;padding:10px 18px;display:flex;gap:12px}
.av{flex-shrink:0;margin-top:2px}
.kol{min-width:0;flex:1;display:flex;flex-direction:column}
.ic{word-wrap:break-word;overflow-wrap:anywhere}
.satir.user{justify-content:flex-end}
.satir.user .kol{flex:0 1 auto;align-items:flex-end;max-width:85%}
.satir.user .ic{background:var(--panel);padding:8px 14px;border-radius:18px}
.eylem{display:flex;gap:2px;margin-top:4px}
.eylem button{background:none;border:0;color:var(--mut);cursor:pointer;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.eylem button:hover,.eylem button:active{background:var(--hover);color:var(--text)}
.ic pre{background:var(--code);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;position:relative}
.ic code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.ic :not(pre)>code{background:var(--panel);padding:2px 6px;border-radius:6px}
.kopya{position:absolute;top:6px;right:6px;background:var(--panel);border:0;border-radius:8px;font-size:12px;padding:3px 8px;cursor:pointer}
.ek,.uret{max-width:100%;max-height:340px;border-radius:14px;display:block;margin:4px 0}
.chip{display:inline-block;background:var(--hover);border:1px solid var(--line);border-radius:10px;padding:3px 10px;font-size:13px;margin:2px 4px 2px 0}
.dur{color:var(--mut);font-size:14px}
.nokta::after{content:"";animation:n 1.2s steps(4,end) infinite}
@keyframes n{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
#bos{margin:auto;text-align:center;padding:20px;width:100%;max-width:640px}
#bos .logo{width:54px;height:54px;border-radius:17px;font-size:26px;margin:0 auto 14px}
#bos h1{font-size:28px;margin:0 0 18px}
#oneri{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
#oneri button{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;font-size:14px}
#oneri button:hover{background:var(--hover)}
#oneri b{display:block;margin-bottom:2px}
#oneri span{color:var(--mut)}
#alt{padding:6px 14px 14px}
#kutu{max-width:780px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:6px}
#ekler{display:flex;flex-wrap:wrap;gap:6px;padding:4px 8px}
#ekler:empty{display:none}
.ekc{display:flex;align-items:center;gap:6px;background:var(--hover);border:1px solid var(--line);border-radius:12px;padding:4px 8px;font-size:13px}
.ekc img{width:36px;height:36px;object-fit:cover;border-radius:8px}
.ekc button{background:none;border:0;cursor:pointer;color:var(--mut);font-size:15px}
#satirk{display:flex;align-items:flex-end;gap:4px}
#girdi{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;resize:none;max-height:200px;padding:9px 4px}
.yb{background:none;border:0;cursor:pointer;border-radius:50%;width:40px;height:40px;flex-shrink:0;color:var(--text);display:flex;align-items:center;justify-content:center}
.yb:hover{background:var(--hover)}
#gonder{background:var(--hover);color:var(--mut);cursor:default}
#gonder.bereit{background:var(--acc);color:#fff;cursor:pointer}
#gonder.bereit:hover{filter:brightness(1.1)}
#mik.on{background:#e5484d;color:#fff}
#not{text-align:center;color:var(--mut);font-size:12px;margin-top:8px}
.pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:220px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.pop button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px}
.pop button:hover{background:var(--hover)}
.pop button.tehlike{color:#ff6b6b}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:90vw;display:none}
dialog{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(520px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 12px}
.alan{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:14px}
.alan small{color:var(--mut)}
.alan input[type=number],.alan select,.alan textarea{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;width:100%}
.alan textarea{min-height:90px;resize:vertical}
.btnler{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.btnler button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.btnler button.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btnler button.t{color:#ff6b6b}
#ort{display:none}
@media(max-width:760px){
 #side{position:fixed;left:-285px;top:0;bottom:0;z-index:30;transition:left .2s}
 body.ac #side{left:0}
 body.ac #ort{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
 body.kapali #side{display:flex}
 #oneri{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="ort" onclick="sideToggle()"></div>
<div id="app">
 <aside id="side">
  <div class="marka"><div class="logo">C</div>CEM AI</div>
  <button class="sbtn" id="b_neu" type="button" onclick="yeniSohbet()"></button>
  <input id="ara" placeholder="Chats durchsuchen" autocomplete="off">
  <div id="liste"></div>
  <div id="durum"></div>
  <button class="sbtn" id="b_set" type="button" onclick="ayarAc()"></button>
 </aside>
 <section id="main">
  <div id="ust">
   <button class="ibtn" id="b_menu" type="button" onclick="sideToggle()" title="Menü"></button>
   <button id="modb" type="button" onclick="modMenu(event)">CEM AI <small id="modet"></small> ▾</button>
  </div>
  <div id="mesajlar"></div>
  <div id="alt">
   <div id="kutu">
    <div id="ekler"></div>
    <div id="satirk">
     <button class="yb" id="arti" type="button" title="Hinzufügen" onclick="artiMenu(event)"></button>
     <textarea id="girdi" rows="1" placeholder="Frag CEM AI etwas"></textarea>
     <button class="yb" id="mik" type="button" title="Spracheingabe" onclick="mikToggle()"></button>
     <button class="yb" id="gonder" type="button" title="Senden"></button>
    </div>
   </div>
   <div id="not">CEM AI kann Fehler machen. Prüfe wichtige Antworten.</div>
  </div>
 </section>
</div>
<input type="file" id="dosya" multiple hidden>
<div id="toast"></div>

<dialog id="dlg">
 <h3>Einstellungen</h3>
 <div class="alan"><label>Design</label>
  <select id="a_tema"><option value="dark">Dunkel</option><option value="light">Hell</option></select></div>
 <div class="alan"><label>Anzahl Runden im Rat-Modus (1–40)</label><input type="number" id="a_tur" min="1" max="40">
  <small>Ein Durchgang = alle Modelle nacheinander. Mehr Runden dauern deutlich länger.</small></div>
 <div class="alan"><label><input type="checkbox" id="a_erken"> Früh stoppen, wenn alle übereinstimmen</label>
  <small>Ausgeschaltet läuft immer die volle Rundenzahl.</small></div>
 <div class="alan"><label>Eigene Anweisungen (Gedächtnis)</label>
  <textarea id="a_talimat" placeholder="Was soll CEM AI über dich wissen? Wie soll es antworten?"></textarea>
  <small>Wird jeder Unterhaltung hinzugefügt und nur in diesem Browser gespeichert.</small></div>
 <div class="alan"><small id="a_modeller"></small></div>
 <div class="btnler">
  <button type="button" onclick="tumunuAktar()">Alle Chats exportieren</button>
  <button type="button" class="t" onclick="tumunuSil()">Alle Chats löschen</button>
  <button type="button" onclick="document.getElementById('dlg').close()">Schließen</button>
  <button type="button" class="p" onclick="ayarKaydet()">Speichern</button>
 </div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const LOGO='<div class="logo">C</div>';

/* ---------- Symbole ---------- */
const IC=(p,s)=>'<svg viewBox="0 0 24 24" width="'+(s||18)+'" height="'+(s||18)+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const P={
 send:'<path d="M12 19V5M5 12l7-7 7 7" stroke-width="2.5"/>',
 stop:'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/>',
 mic:'<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
 speaker:'<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',
 edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>',
 refresh:'<path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/>',
 down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
 sliders:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
 clip:'<path d="M21 12.5 12.5 21a5.5 5.5 0 0 1-8-8L13 4.5a3.7 3.7 0 0 1 5.2 5.2L9.7 18a1.8 1.8 0 0 1-2.6-2.6L15 7.5"/>',
 image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>',
 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>'
};

/* ---------- Anbieter ---------- */
/* Schlüssel stehen hier. Gib diese Datei niemandem weiter, sie sind im Quelltext sichtbar.
   Modellnamen ändern sich mit der Zeit: bei Fehlern hier aktualisieren.
   Reihenfolge = Reihenfolge der Kette im Rat-Modus. */
const SAG=[
 {ad:'openai',tur:'openai',url:'https://api.openai.com/v1',model:'gpt-4o-mini',key:'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'},
 {ad:'gemini',tur:'gemini',model:'gemini-3.8-flash',key:'AIzaSyD-ExtraKeySimulatedForCem001_TestKeyMax'},
 {ad:'gemini2',tur:'gemini',model:'gemini-3.5-flash-lite',key:'AQ.Ab8RN6Je1UYYg40f_bhjXMxCa6T-YZp60MxrvMCVjFjLqBXNpQ'},
 {ad:'groq',tur:'openai',url:'https://api.groq.com/openai/v1',model:'llama-3.3-70b-versatile',gorsel:false,key:'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'},
 {ad:'openrouter',tur:'openai',url:'https://openrouter.ai/api/v1',model:'openai/gpt-4o',key:'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'},
 {ad:'openrouter2',tur:'openai',url:'https://openrouter.ai/api/v1',model:'anthropic/claude-3.5-sonnet',key:'sk-or-v1-backup9999-mghub-engine-2026-xyz789'}
];
const DEBUG=/[?&]debug\b/.test(location.search);
function FE(m){const e=new Error(m);e.fr=1;return e}
function nAd(a){return 'Modell '+(SAG.findIndex(x=>x.ad===a)+1)}
function gAd(a){return DEBUG?a:nAd(a)}
function maske(t){
 t=String(t);if(DEBUG)return t;
 return t.replace(/generativelanguage\.googleapis\.com|nano-banana[\w.\-]*|gemini[\w.\-]*|google[\w.\-]*|openrouter|openai|anthropic|claude[\w.\-]*|groq|llama[\w.\-]*|gpt[\w.\-]*/gi,'…');
}
const IMG_MODEL='gemini-nano-banana-2.1';
const IMG_MODEL_ESKI='gemini-2.5-flash-image';
const GEMINI='https://generativelanguage.googleapis.com/v1beta';

const SPRACHREGEL="WICHTIG zur Sprache: Antworte in der Sprache, in der die LETZTE Nachricht des Nutzers geschrieben ist (Englisch → Englisch, Deutsch → Deutsch, Türkisch → Türkisch, Arabisch → Arabisch, Russisch → Russisch, Französisch → Französisch usw.). Wechselt der Nutzer die Sprache, wechselst du sofort mit. Nimm nie automatisch Deutsch oder Türkisch. Schreibe wie ein Muttersprachler: natürlich, flüssig, ohne Übersetzungs-Stil.";
const KIMLIK="IDENTITÄT: Du heißt CEM AI. Auf Fragen wie 'Wer bist du?', 'Welches Modell bist du?', 'Bist du Gemini, ChatGPT, Claude oder Llama?', 'Wer hat dich gebaut?' oder 'Welche API benutzt du?' antwortest du nur, dass du CEM AI bist, ein KI-Assistent, und dass du keine Details zur Technik dahinter teilst. Nenne niemals die Namen zugrunde liegender Modelle, Firmen oder Anbieter (z. B. Gemini, Google, OpenAI, GPT, Claude, Anthropic, Llama, Meta, Groq, OpenRouter) und sprich nie über API-Schlüssel oder Anbieter. Du gibst dich nie als Mensch aus.";
const SISTEM="Du bist ein sorgfältiger Löser und Prüfer. Löse die Aufgabe Schritt für Schritt und prüfe Annahmen und Rechnungen. "+SPRACHREGEL+" "+KIMLIK+" Schreibe die Lösung normal in der Sprache des Nutzers, ohne deutsche Überschriften. Beende deine Antwort mit genau diesen zwei Zeilen (die Wörter LABEL und FINAL bleiben immer so stehen, der Inhalt steht in der Sprache des Nutzers):\nLABEL: <die Wörter 'Endgültige Antwort' in der Sprache des Nutzers>\nFINAL: <kurze endgültige Antwort in einer Zeile>";
const SOHBET_SISTEM="Du bist CEM AI, ein vielseitiger, lockerer und kluger Assistent. Du bist nicht nur für Hausaufgaben da, sondern für alles: Alltag, Fragen, Ideen, Programmieren, Rat, Smalltalk und Spaß. Auf Smalltalk (z. B. 'Selam', 'Hallo', 'Wie geht's?') antwortest du ganz normal und freundlich, ohne nach einer Aufgabe zu fragen. "+SPRACHREGEL+" "+KIMLIK+" Passe deinen Ton an den Nutzer an: schreibt er locker oder umgangssprachlich (z. B. 'kanka'), antworte genauso locker. Beginne nicht mit Floskeln und sage nie, dass du nur für Aufgaben da bist. In jeder Sprache: schreibe wie ein echter Muttersprachler im Alltag, mit natürlichen Wendungen.";
const RAT_RE=/^\/(rat|ödev|odev|aufgabe|hausaufgabe)(\s|$)/i;
const AUFG_RE=new RegExp('\\d\\s*[+*^=×÷]\\s*\\d|\\d\\s+[-/]\\s+\\d|[∫√∑]|(^|[^\\p{L}])(?:löse|berechne|rechne|aufgabe|hausaufgabe|gleichung|beweise|ableit|integral|solve|calculat|homework|equation|prove|derivativ|çöz|hesapla|ödev|denklem|ispat|kanıtla|türev|résou|calcul|devoir|resuelv|resolver|tarea)','iu');
function ratGerekli(m){
 const t=(m.content||'').trim();
 if(RAT_RE.test(t)||AUFG_RE.test(t))return true;
 return !t&&!!(m.resimler&&m.resimler.length);
}

function aktifler(){return SAG.filter(s=>s.key)}

/* ---------- Speicher ---------- */
function oku(k,v){try{const x=localStorage.getItem(k);return x?JSON.parse(x):v}catch(e){return v}}
let ayar=Object.assign({tema:'dark',mod:'konsey',tur:10,erken:true,talimat:''},oku('cem_v2_ayar',{}));
let sohbetler=oku('cem_v2_sohbetler',null)||oku('cem_sohbetler',[]);
let aktif=null,bekliyor=false,ctrl=null,ekler=[];
function ayarYaz(){try{localStorage.setItem('cem_v2_ayar',JSON.stringify(ayar))}catch(e){}}
if(!ayar.v3){ayar.tur=10;ayar.erken=true;ayar.v3=1;ayarYaz()}
function kaydet(){
 try{localStorage.setItem('cem_v2_sohbetler',JSON.stringify(sohbetler))}
 catch(e){
  try{
   const k=JSON.parse(JSON.stringify(sohbetler,(key,val)=>key==='data'?undefined:val));
   localStorage.setItem('cem_v2_sohbetler',JSON.stringify(k));
  }catch(e2){}
 }
}
let toastT=null;
function toast(t){
 const e=$('toast');e.textContent=t;e.style.display='block';
 clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',2800);
}

/* ---------- API ---------- */
function hataMetni(j,kod){
 const e=j&&j.error;
 return (e&&(e.message||(typeof e==='string'?e:JSON.stringify(e))))||(j&&j.message)||('HTTP '+kod);
}
function bulBloklar(o,tip,out){
 out=out||[];
 if(Array.isArray(o))o.forEach(x=>bulBloklar(x,tip,out));
 else if(o&&typeof o==='object'){
  if(o.type===tip)out.push(o);
  Object.values(o).forEach(v=>{if(v&&typeof v==='object')bulBloklar(v,tip,out)});
 }
 return out;
}
async function sor(s,metin,sistem,resimler){
 resimler=resimler||[];
 let r,j;
 if(s.tur==='openai'){
  const icerik=resimler.length?[{type:'text',text:metin}].concat(resimler.map(x=>({type:'image_url',image_url:{url:'data:'+x.mime+';base64,'+x.data}}))):metin;
  r=await fetch(s.url+'/chat/completions',{method:'POST',
   headers:{'Authorization':'Bearer '+s.key,'Content-Type':'application/json'},
   body:JSON.stringify(Object.assign({model:s.model,messages:[{role:'system',content:sistem},{role:'user',content:icerik}]},/api\.openai\.com/.test(s.url)?{max_completion_tokens:3500}:{max_tokens:3500}))});
  j=await r.json();if(!r.ok)throw new Error(hataMetni(j,r.status));
  return j.choices[0].message.content;
 }
 if(s.tur==='anthropic'){

/* ---------- Rat (Kette: ein Modell nach dem anderen) ---------- */
function finalCek(t){
 const m=[...t.matchAll(/FINAL\*{0,2}:\*{0,2}\s*(.+)/g)];
 return m.length?m[m.length-1][1].trim():t.trim().slice(-200);
}
function labelCek(t){
 const m=[...t.matchAll(/LABEL\*{0,2}:\*{0,2}\s*(.+)/g)];
 return m.length?m[m.length-1][1].replace(/[*_]+/g,'').replace(/[\s:：]+$/,'').trim().slice(0,40):'';
}
function temizle(t){
 return t.replace(/^[ \t>*_#-]*(LABEL|FINAL)\*{0,2}:.*$/gm,'').replace(/^[ \t]*LÖSUNG:[ \t]*/gm,'').replace(/\n{3,}/g,'\n\n').trim();
}
function norm(t){return t.toLowerCase().replace(/[\s.,;:*$\\]+/g,'')}
function oyla(finaller){
 const say={};
 Object.values(finaller).forEach(f=>{const n=norm(f);say[n]=(say[n]||0)+1});
 const e=Object.entries(say).sort((a,b)=>b[1]-a[1])[0];
 return {kazanan:e[0],adet:e[1]};
}
function iptalKontrol(){
 if(ctrl&&ctrl.signal.aborted){const e=new Error('Abgebrochen');e.name='AbortError';throw e}
}
function keinModell(h){return DEBUG?'Kein Modell hat geantwortet:\n'+hatalarMetni(h):'CEM AI ist gerade nicht erreichbar. Bitte versuche es gleich noch einmal.'}
function hatalarMetni(h){return Object.entries(h).map(([a,m])=>'- '+gAd(a)+': '+maske(String(m).slice(0,160))).join('\n')}
function kettenPrompt(soru,vor,finals){
 if(!vor)return 'AUFGABE:\n'+soru;
 const f=Object.entries(finals).map(([a,x])=>'- '+nAd(a)+': '+x).join('\n');
 return 'AUFGABE:\n'+soru+'\n\nLösung des vorherigen Modells ('+nAd(vor.ad)+'):\n'+vor.text+'\n\nBisherige Endantworten aller Modelle:\n'+f+'\n\nPrüfe die vorherige Lösung kritisch: Rechenfehler, Denkfehler, fehlende Fälle? Korrigiere sie, falls nötig, oder bestätige sie mit Begründung. Schreibe dann deine eigene endgültige Lösung, kompakt (nur die nötigen Schritte), in der Sprache der letzten Nachricht des Nutzers (nicht Deutsch, außer er schreibt Deutsch), und beende sie mit den Zeilen LABEL und FINAL. Arbeite zügig.';
}

async function hizli(soru,sistem,resimler){
 const hatalar={};
 for(const s of aktifler().filter(x=>!(resimler&&resimler.length)||x.gorsel!==false)){
  try{const c=await sor(s,soru,sistem,resimler);iptalKontrol();return c}
  catch(e){if(e.name==='AbortError')throw e;hatalar[s.ad]=e.message}
 }
 throw FE(keinModell(hatalar));
}

async function rat(soru,resimler,sistem,runden,frueh,ilerleme){
 let akt=aktifler().filter(x=>!(resimler&&resimler.length)||x.gorsel!==false);
 const alle=akt.slice(),letzte={},fehler={};
 let vor=null,einig=0,adet=0,kazanan='',n=0;
 for(let r=1;r<=runden;r++){
  for(const s of akt.slice()){
   iptalKontrol();
   ilerleme(r,runden,s.ad,adet,n);
   const finals={};Object.keys(letzte).forEach(a=>finals[a]=letzte[a].final);
   try{
    const text=await sor(s,kettenPrompt(soru,vor,finals),sistem,resimler);
    iptalKontrol();
    letzte[s.ad]={text,final:finalCek(text),label:labelCek(text)};vor={ad:s.ad,text};
   }catch(e){
    if(e.name==='AbortError')throw e;
    fehler[s.ad]=e.message;
    if(!letzte[s.ad])akt=akt.filter(x=>x!==s);
   }
  }
  if(!Object.keys(letzte).length)throw FE(keinModell(fehler));
  const fin={};Object.keys(letzte).forEach(a=>fin[a]=letzte[a].final);
  const o=oyla(fin);kazanan=o.kazanan;adet=o.adet;n=Object.keys(fin).length;
  ilerleme(r,runden,null,adet,n);
  if(akt.length<2)break;
  einig=(adet===n)?einig+1:0;
  if(frueh&&einig>=1)break;
 }
 const reihe=alle.map(s=>s.ad).filter(a=>letzte[a]&&norm(letzte[a].final)===kazanan);
 const ad=reihe[reihe.length-1];
 const lab=letzte[ad].label;
 let m=(lab?'**'+lab+':** ':'**→** ')+letzte[ad].final+'\n\n'+temizle(letzte[ad].text)+'\n\n✓ '+adet+'/'+n;
 if(adet<n)m+='\n\n⚠\n'+Object.keys(letzte).map(a=>'- '+gAd(a)+': '+letzte[a].final).join('\n');
 const dis=alle.filter(s=>!letzte[s.ad]);
 if(DEBUG&&dis.length)m+='\n\n✗\n'+dis.map(s=>'- '+gAd(s.ad)+': '+maske(String(fehler[s.ad]||'').slice(0,140))).join('\n');
 return m;
}

function b64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)})}
function kucult(f){
 return new Promise(res=>{
  if(!/^image\/(jpeg|png|webp)$/i.test(f.type)){res(null);return}
  const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{
   try{
    const M=1600,k=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);
    res({mime:'image/jpeg',data:c.toDataURL('image/jpeg',0.85).split(',')[1]});
   }catch(e){URL.revokeObjectURL(u);res(null)}
  };
  im.onerror=()=>{URL.revokeObjectURL(u);res(null)};
  im.src=u;
 });
}
async function ekle(f){
 if(f.type.startsWith('image/')){
  const k=await kucult(f);
  if(k){ekler.push({tur:'resim',ad:f.name||'Bild',mime:k.mime,data:k.data});return}
  if(f.size>8*1024*1024){toast('Bild ist größer als 8 MB.');return}
  ekler.push({tur:'resim',ad:f.name||'Bild',mime:f.type,data:await b64(f)});
 }else if(f.type.startsWith('text/')||/\.(txt|md|csv|json|js|ts|py|html|css|java|c|cpp|cs|go|rs|php|sql|xml|yml|yaml|log)$/i.test(f.name)){
  if(f.size>300*1024){toast('Textdatei ist größer als 300 KB.');return}
  ekler.push({tur:'metin',ad:f.name,metin:await f.text()});
 }else toast('Dateityp nicht unterstützt (nur Bilder und Text-/Code-Dateien).');
}

  rec.onresult=e=>{const t=[...e.results].map(r=>r[0].transcript).join(' ');$('girdi').value=($('girdi').value+' '+t).trim();oto()};
  rec.onend=()=>{dinliyor=false;$('mik').classList.remove('on')};

   else if(e.error==='no-speech')toast('Keine Sprache erkannt.');
   else toast('Spracheingabe nicht möglich ('+e.error+').');
  };
  rec.start();dinliyor=true;$('mik').classList.add('on');
 }catch(e){toast('Spracheingabe nicht verfügbar.')}

let stimmen=[];
function stimmenLaden(){try{stimmen=speechSynthesis.getVoices()}catch(e){}}
if('speechSynthesis' in window){stimmenLaden();speechSynthesis.onvoiceschanged=stimmenLaden}
function spracheErkennen(t){
 if(/[çğışİ]/.test(t))return 'tr-TR';
 if(/[äß]|\b(der|die|das|und|ist|nicht|ich|ein|eine|mit|für)\b/i.test(t))return 'de-DE';
 if(/\b(ve|bir|bu|için|ama|ile|çok)\b/i.test(t))return 'tr-TR';
 if(/\b(the|and|is|are|you|this|that|with)\b/i.test(t))return 'en-US';
 return 'de-DE';
}
function vorlesen(t){
 if(!('speechSynthesis' in window)){toast('Dieser Browser unterstützt keine Sprachausgabe.');return}
 if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();return}
 const text=t.replace(/```[\s\S]*?```/g,' Codeblock. ').replace(/[*`#_>]/g,'').trim();
 if(!text)return;
 const lang=spracheErkennen(text);
 const teile=text.match(/[^.!?\n]+[.!?\n]*/g)||[text];
 const chunks=[];let cur='';
 teile.forEach(p=>{if((cur+p).length>180){if(cur)chunks.push(cur);cur=p}else cur+=p});
 if(cur)chunks.push(cur);
 stimmenLaden();
 const v=stimmen.find(x=>x.lang&&x.lang.replace('_','-')===lang)||stimmen.find(x=>x.lang&&x.lang.toLowerCase().startsWith(lang.slice(0,2)));
 chunks.forEach((c,i)=>{
  const u=new SpeechSynthesisUtterance(c);u.lang=lang;if(v)u.voice=v;
  if(i===0)u.onerror=e=>{if(e.error&&e.error!=='canceled'&&e.error!=='interrupted')toast('Vorlesen nicht möglich ('+e.error+'). Öffne die Datei im normalen Browser.')};
  speechSynthesis.speak(u);
 });
}

function indir(ad,icerik,tur){
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([icerik],{type:tur||'text/plain'}));
 a.download=ad;document.body.append(a);a.click();a.remove();
}
function aktar(s){
 const t='# '+s.baslik+'\n\n'+s.mesajlar.map(m=>'**'+(m.role==='user'?'Du':'CEM AI')+':**\n'+tamMetin(m)).join('\n\n');
 indir('cem-ai-'+s.baslik.replace(/[^\w\-]+/g,'_').slice(0,30)+'.md',t,'text/markdown');
}
function tumunuAktar(){indir('cem-ai-alle-chats.json',JSON.stringify(sohbetler,(k,v)=>k==='data'?undefined:v,2),'application/json')}
function tumunuSil(){
 if(!confirm('Alle Chats löschen? Das kann nicht rückgängig gemacht werden.'))return;
 sohbetler=[];aktif=null;kaydet();renderListe();renderMesajlar();$('dlg').close();
}

/* ---------- Nachrichten zeichnen ---------- */
function eylemBtn(ik,title,fn){
 const b=el('button','',IC(ik,17));b.type='button';b.title=title;b.setAttribute('aria-label',title);
 b.onclick=e=>{e.stopPropagation();fn()};return b;
}
function mesajEl(m,i,sonAI){
 const kul=m.role==='user';
 const d=el('div','satir '+(kul?'user':'ai'));
 if(!kul)d.append(el('div','av',LOGO));
 const k=el('div','kol'),ic=el('div','ic');
 if(kul){
  (m.resimler||[]).forEach(r=>{
   if(r.data){const im=el('img','ek');im.src='data:'+r.mime+';base64,'+r.data;ic.append(im)}
   else ic.append(el('div','chip','Bild: '+esc(r.ad||'Bild')));
  });
  (m.dosyalar||[]).forEach(f=>ic.append(el('div','chip','Datei: '+esc(f.ad))));
  if(m.content){const p=el('div');p.style.whiteSpace='pre-wrap';p.textContent=m.content;ic.append(p)}
 }else{
  if(m.uretilen){
   if(m.uretilen.data){const im=el('img','uret');im.src='data:'+m.uretilen.mime+';base64,'+m.uretilen.data;ic.append(im)}
   else ic.append(el('div','dur','Erstelltes Bild (nach dem Schließen der Seite nicht gespeichert)'));
  }
  if(m.content)ic.append(el('div','',md(m.content)));
 }
 k.append(ic);
 const ey=el('div','eylem');
 if(m.content)ey.append(eylemBtn(P.copy,'Kopieren',()=>kopyaYaz(m.content)));
 if(kul){
  ey.append(eylemBtn(P.edit,'Bearbeiten',()=>duzenle(i)));
 }else{
  if(m.content)ey.append(eylemBtn(P.speaker,'Vorlesen',()=>vorlesen(m.content)));
  if(m.uretilen&&m.uretilen.data)ey.append(eylemBtn(P.down,'Herunterladen',()=>{
   const a=document.createElement('a');a.href='data:'+m.uretilen.mime+';base64,'+m.uretilen.data;a.download='cem-ai-bild.png';
   document.body.append(a);a.click();a.remove();
  }));
  if(sonAI)ey.append(eylemBtn(P.refresh,'Neu generieren',yeniden));
 }
 k.append(ey);d.append(k);return d;
}
const ONERILER=[
 ['Hausaufgabe lösen','Schritt für Schritt erklären lassen','Löse diese Aufgabe Schritt für Schritt:\n'],
 ['Bild erstellen','Beschreibe dein Wunschbild','/bild '],
 ['Code-Fehler finden','Fehler finden und beheben','Finde und behebe den Fehler in diesem Code:\n'],
 ['Einfach erklären','Schwieriges Thema vereinfachen','Erkläre mir dieses Thema so, als wäre ich 10 Jahre alt: ']
];
function renderMesajlar(){
 const m=$('mesajlar');m.innerHTML='';
 const s=cur();
 if(!s||!s.mesajlar.length){
  const b=el('div');b.id='bos';
  b.innerHTML=LOGO+'<h1>Wie kann ich dir heute helfen?</h1>';
  const g=el('div');g.id='oneri';
  ONERILER.forEach(o=>{
   const bt=el('button','','<b>'+o[0]+'</b><span>'+o[1]+'</span>');bt.type='button';
   bt.onclick=()=>{$('girdi').value=o[2];$('girdi').focus();oto()};
   g.append(bt);
  });
  b.append(g);m.append(b);return;
 }
 s.mesajlar.forEach((x,i)=>m.append(mesajEl(x,i,x.role!=='user'&&i===s.mesajlar.length-1)));
 m.scrollTop=m.scrollHeight;
}
function yukleniyorEkle(){
 const d=el('div','satir ai');d.id='yukleniyor';
 d.append(el('div','av',LOGO),el('div','kol','<div class="ic"><span class="dur">Denkt nach<span class="nokta"></span></span></div>'));
 $('mesajlar').append(d);$('mesajlar').scrollTop=$('mesajlar').scrollHeight;
}
function yukleniyorYaz(h){const y=$('yukleniyor');if(y)y.querySelector('.ic').innerHTML=h}
function sendDurum(){
 const g=$('gonder');
 const bos=!$('girdi').value.trim()&&!ekler.length;
 g.innerHTML=bekliyor?IC(P.stop,18):IC(P.send,20);
 g.classList.toggle('bereit',!bos||bekliyor);
 g.title=bekliyor?'Stopp':'Senden';
}
function butonDurum(){sendDurum()}

/* ---------- Senden / Erzeugen ---------- */
const BILD_RE=/^\/(bild|resim|image)(\s|$)/i;
async function gonder(){
 const t=$('girdi').value.trim();
 if((!t&&!ekler.length)||bekliyor)return;
 if(!cur()){
  const s={id:Date.now().toString(),baslik:(t||'Anhang').replace(BILD_RE,'Bild: ').slice(0,40),mesajlar:[]};
  sohbetler.push(s);aktif=s.id;
 }
 const s=cur();
 const m={role:'user',content:t};
 const r=ekler.filter(e=>e.tur==='resim').map(e=>({ad:e.ad,mime:e.mime,data:e.data}));
 const f=ekler.filter(e=>e.tur==='metin').map(e=>({ad:e.ad,metin:e.metin}));
 if(r.length)m.resimler=r;
 if(f.length)m.dosyalar=f;
 s.mesajlar.push(m);
 $('girdi').value='';oto();ekler=[];renderEkler();
 kaydet();renderListe();renderMesajlar();
 await uret(s);
}
async function yeniden(){
 const s=cur();if(!s||bekliyor)return;
 if(s.mesajlar.length&&s.mesajlar[s.mesajlar.length-1].role!=='user')s.mesajlar.pop();
 if(!s.mesajlar.length)return;
 kaydet();renderMesajlar();
 await uret(s);
}
function duzenle(i){
 const s=cur();if(!s||bekliyor)return;
 const m=s.mesajlar[i];
 $('girdi').value=m.content||'';
 s.mesajlar.length=i;
 kaydet();renderMesajlar();oto();$('girdi').focus();
}
async function uret(s){
 const son=s.mesajlar[s.mesajlar.length-1];
 bekliyor=true;ctrl=new AbortController();butonDurum();yukleniyorEkle();
 let cevap=null,uretilen=null,hata=null;
 try{
  const t=(son.content||'').trim();
  if(BILD_RE.test(t)){
   const istek=t.replace(BILD_RE,'')||'eine schöne Landschaft';
   const r=await resimUret(istek,son.resimler||[]);
   iptalKontrol();
   uretilen={mime:r.mime,data:r.data};cevap=r.text||'';
  }else{
   const akt=aktifler();
   if(!akt.length)throw FE('Kein Modell verfügbar.');
   const soru=konusmaMetni(s.mesajlar),resimler=son.resimler||[];
   if(ayar.mod==='hizli'||akt.length<2||!ratGerekli(son)){
    cevap=await hizli(soru,SOHBET_SISTEM+talimatEk(),resimler);
   }else{
    const runden=Math.max(1,Math.min(+ayar.tur||10,40));
    cevap=await rat(soru,resimler,SISTEM+talimatEk(),runden,!!ayar.erken,(r,top,ad,oy,n)=>{
     yukleniyorYaz('<span class="dur">Rat arbeitet: Runde '+r+'/'+top+(ad?' · '+gAd(ad)+' prüft':'')+(n?' ('+oy+'/'+n+' einig)':'')+'<span class="nokta"></span></span>');
    });
   }
  }
 }catch(e){
  hata=(e.name==='AbortError')?'Abgebrochen.':(e instanceof TypeError?(DEBUG?'Netzwerkfehler oder CORS-Sperre: '+maske(e.message):'Netzwerkfehler. Prüfe deine Verbindung und versuche es noch einmal.'):((DEBUG||e.fr)?maske(e.message||'Unbekannter Fehler'):'Etwas ist schiefgelaufen. Bitte versuche es noch einmal.'));
 }
 bekliyor=false;ctrl=null;butonDurum();
 const a={role:'assistant',content:uretilen?(cevap||''):(cevap||('⚠️ '+hata))};
 if(uretilen)a.uretilen=uretilen;
 s.mesajlar.push(a);
 kaydet();renderMesajlar();
}

/* ---------- Einstellungen ---------- */
function ayarAc(){
 $('a_tema').value=ayar.tema;$('a_tur').value=ayar.tur;$('a_erken').checked=!!ayar.erken;$('a_talimat').value=ayar.talimat;
 $('a_modeller').textContent='Aktive Modelle (Reihenfolge der Kette): '+(aktifler().map(s=>gAd(s.ad)+(DEBUG?' ('+s.model+')':'')).join(' → ')||'keine');
 document.body.classList.remove('ac');
 $('dlg').showModal();
}
function ayarKaydet(){
 ayar.tema=$('a_tema').value;
 ayar.tur=Math.max(1,Math.min(+$('a_tur').value||40,40));
 ayar.erken=$('a_erken').checked;
 ayar.talimat=$('a_talimat').value;
 ayarYaz();temaUygula();$('dlg').close();
}
function temaUygula(){document.documentElement.dataset.tema=ayar.tema}

/* ---------- Start ---------- */
function oto(){const g=$('girdi');g.style.height='auto';g.style.height=Math.min(g.scrollHeight,200)+'px';sendDurum()}
$('girdi').addEventListener('input',oto);
$('girdi').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>760){e.preventDefault();gonder()}});
$('gonder').addEventListener('click',()=>{if(bekliyor&&ctrl)ctrl.abort();else gonder()});
$('b_neu').innerHTML=IC(P.edit,18)+'<span>Neuer Chat</span>';
$('b_set').innerHTML=IC(P.sliders,18)+'<span>Einstellungen</span>';
$('b_menu').innerHTML=IC(P.menu,22);
$('arti').innerHTML=IC(P.plus,22);
$('mik').innerHTML=IC(P.mic,20);
temaUygula();modYaz();
$('durum').textContent=aktifler().length+' Modelle bereit';
sendDurum();renderListe();renderMesajlar();
</script>
</body>
