<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGD HUB CORE - Ultimate Kahoot Solver</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.7);
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 6px;
            background: linear-gradient(45deg, #58a6ff, #3fb950);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }
        .subtitle {
            text-align: center;
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 22px;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .card {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .card h2 {
            font-size: 13px;
            margin-bottom: 8px;
            color: #58a6ff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, textarea {
            width: 100%;
            background: #161b22;
            border: 1px solid #30363d;
            color: #3fb950;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 10px;
            outline: none;
            transition: 0.2s;
        }
        input:focus, textarea:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
        }
        textarea {
            height: 80px;
            resize: none;
            font-family: monospace;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #238636, #2ea043);
            color: #fff;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.15s;
            font-size: 15px;
            box-shadow: 0 4px 0 #196c2e;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #196c2e;
        }
        .game-panel {
            display: none;
        }
        .q-display {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 14px;
            min-height: 45px;
            color: #c9d1d9;
            font-family: monospace;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .opt-btn {
            padding: 16px;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid transparent;
            color: white;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            transition: 0.2s;
        }
        .opt-0 { background: #da3633; } /* Kırmızı */
        .opt-1 { background: #1f6feb; } /* Mavi */
        .opt-2 { background: #9e6a03; } /* Sarı */
        .opt-3 { background: #238636; } /* Yeşil */
        
        .opt-btn.correct {
            border: 3px solid #ffffff;
            box-shadow: 0 0 25px #3fb950;
            transform: scale(1.05);
        }
        .opt-btn.dimmed {
            opacity: 0.2;
        }
        .status {
            text-align: center;
            font-size: 12px;
            color: #3fb950;
            margin-top: 8px;
            font-weight: bold;
            min-height: 18px;
        }
        .lobby-info {
            display: flex;
            justify-content: space-between;
            background: #161b22;
            border: 1px solid #30363d;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 12px;
            color: #8b949e;
        }
        .lobby-info span {
            color: #58a6ff;
            font-weight: bold;
        }
        .footer {
            text-align: center;
            font-size: 10px;
            color: #484f58;
            margin-top: 15px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MGD HUB CORE</h1>
        <div class="subtitle">ULTIMATE KAHOT AI SOLVER</div>

        <!-- 1. GİRİŞ EKRANI -->
        <div id="loginScreen" class="card">
            <h2>🎮 Oyun Girişi</h2>
            <input type="text" id="gamePin" placeholder="Game PIN (Oda ID)..." style="text-align:center;">
            <input type="text" id="nickname" placeholder="Nickname (Takma Ad)..." style="text-align:center; margin-bottom: 14px;">
            <button class="btn" onclick="connectGame()">Sisteme Bağlan ⚡</button>
            <div class="status" id="loginStatus" style="color: #f85149;"></div>
        </div>

        <!-- 2. OYUN LOBİSİ & AI ÇÖZÜCÜ -->
        <div id="gameScreen" class="game-panel">
            
            <div class="lobby-info">
                <div>Oda PIN: <span id="displayPin">000000</span></div>
                <div>Oyuncu: <span id="displayNick">-</span></div>
            </div>

            <div class="card">
                <h2>⚡ Anlık Soru Yakalayıcı</h2>
                <textarea id="questionInput" placeholder="Soruyu ve şıkları buraya yapıştır (Anında çözer)..." oninput="autoTriggerSolve()"></textarea>
            </div>

            <div class="card">
                <h2>🎯 Yapay Zeka Cevap Paneli</h2>
                <div class="q-display" id="activeQuestionText">Soru bekleniyor...</div>
                <div class="options-grid">
                    <button class="opt-btn opt-0" id="b0">1. Şık</button>
                    <button class="opt-btn opt-1" id="b1">2. Şık</button>
                    <button class="opt-btn opt-2" id="b2">3. Şık</button>
                    <button class="opt-btn opt-3" id="b3">4. Şık</button>
                </div>
                <div class="status" id="aiStatus">Yapay zeka aktif 🚀</div>
            </div>

            <button onclick="resetApp()" style="background: transparent; color: #f85149; border: 1px solid #f85149; font-size: 12px; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold;">Odadan Ayrıl / Çıkış Yap</button>
        </div>

        <div class="footer">MGD SYSTEMS &copy; 2026 - ALL RIGHTS RESERVED</div>
    </div>

    <script>
        const apiKey = "AQ.Ab8RN6JJAvXT24-2-xm-8u4TgPg-hkVi50FKl26UnQqW2y86ug";
        let lastCheckedText = "";

        function connectGame() {
            const gamePin = document.getElementById('gamePin').value.trim();
            const nickname = document.getElementById('nickname').value.trim();

            if (!gamePin || !nickname) {
                document.getElementById('loginStatus').innerText = "⚠ PIN veya Nickname boş bırakılamaz kanka!";
                return;
            }

            document.getElementById('loginStatus').innerText = "";
            document.getElementById('displayPin').innerText = gamePin;
            document.getElementById('displayNick').innerText = nickname;

            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
        }

        async function autoTriggerSolve() {
            const rawText = document.getElementById('questionInput').value.trim();
            if (rawText.length < 3 || rawText === lastCheckedText) return;
            
            lastCheckedText = rawText;
            document.getElementById('aiStatus').innerText = "⚡ Hızla analiz ediliyor...";

            const MODEL_NAME = "gemini-2.5-flash";
            const prompt = `Bu bir Kahoot sorusudur. Hangi dilde olursa olsun (Türkçe, İngilizce, Almanca vb.) soruyu çöz ve SADECE doğru şıkkın numarasını (1, 2, 3 veya 4) rakam olarak yaz. Başka hiçbir şey yazma.\n\n${rawText}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                
                if (data.error) {
                    document.getElementById('aiStatus').style.color = "#f85149";
                    document.getElementById('aiStatus').innerText = "❌ API Anahtarı Hatası!";
                    return;
                }

                const aiText = data.candidates[0].content.parts[0].text.trim();
                const match = aiText.match(/[1-4]/);

                if (match) {
                    const correctIndex = parseInt(match[0]) - 1;
                    highlightCorrectOption(correctIndex);
                    document.getElementById('activeQuestionText').innerText = "Çözüldü: " + rawText.split('\n')[0];
                    document.getElementById('aiStatus').style.color = "#3fb950";
                    document.getElementById('aiStatus').innerText = `🚀 Doğru Şık: ${correctIndex + 1} Numaralı Şık`;
                } else {
                    document.getElementById('aiStatus').innerText = "⚠ Cevap tam okunamadı.";
                }
            } catch (error) {
                document.getElementById('aiStatus').style.color = "#f85149";
                document.getElementById('aiStatus').innerText = "❌ Sunucu bağlantı hatası!";
            }
        }

        function highlightCorrectOption(index) {
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`b${i}`);
                btn.classList.remove('correct', 'dimmed');
                if (i === index) {
                    btn.classList.add('correct');
                } else {
                    btn.classList.add('dimmed');
                }
            }
        }

        function resetApp() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('questionInput').value = '';
            document.getElementById('activeQuestionText').innerText = "Soru bekleniyor...";
            document.getElementById('aiStatus').innerText = "Yapay zeka aktif 🚀";
            lastCheckedText = "";
            for (let i = 0; i < 4; i++) {
                document.getElementById(`b${i}`).classList.remove('correct', 'dimmed');
            }
        }
    </script>
</body>
</html>
