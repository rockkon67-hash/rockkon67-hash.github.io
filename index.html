<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CemTalk Application</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #090d16; color: #f1f5f9; height: 100vh; overflow: hidden; display: flex; }

    /* Sol Üst Dil Seçici */
    .top-left-lang {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 14px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }
    .top-left-lang select {
      background: transparent;
      color: #38bdf8;
      border: none;
      font-weight: bold;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .top-left-lang select option { background: #0f172a; color: #fff; }

    /* Giriş / Kayıt Ekranı */
    .auth-container {
      width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center;
      background: radial-gradient(circle at top left, #1e1b4b, #090d16);
    }
    .auth-card {
      background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px; border-radius: 24px; width: 360px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(16px);
    }
    .auth-card h1 {
      font-size: 28px; font-weight: 900; margin-bottom: 8px;
      background: linear-gradient(to right, #c084fc, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .auth-card p { font-size: 12px; color: #94a3b8; margin-bottom: 24px; }
    .auth-card input {
      width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px;
      border: 1px solid #334155; background: rgba(30, 41, 59, 0.6); color: #fff; font-size: 14px; outline: none;
    }
    .auth-card button {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: linear-gradient(to right, #a855f7, #06b6d4); color: #fff; font-weight: bold; cursor: pointer;
    }
    .auth-toggle { margin-top: 16px; font-size: 12px; color: #94a3b8; }
    .auth-toggle span { color: #c084fc; font-weight: bold; cursor: pointer; }

    /* Ana Chat Ekranı */
    .chat-app { display: none; width: 100%; height: 100vh; flex-direction: row; }
    .sidebar { width: 80px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; }
    .chat-list { width: 300px; background: #111827; border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
    .chat-list-header { padding: 20px; font-weight: bold; border-bottom: 1px solid #1e293b; }
    .chat-main { flex: 1; display: flex; flex-direction: column; background: #0b0f19; }
    .chat-header { height: 60px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; }
    .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg-bubble { max-width: 60%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; }
    .msg-me { align-self: flex-end; background: #8b5cf6; color: #fff; }
    .msg-them { align-self: flex-start; background: #1e293b; color: #e2e8f0; }
    .chat-input { height: 70px; border-top: 1px solid #1e293b; padding: 10px 20px; display: flex; align-items: center; gap: 10px; }
    .chat-input input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #fff; outline: none; }
    .chat-input button { padding: 12px 20px; border: none; border-radius: 10px; background: #06b6d4; color: #fff; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- SOL ÜST 30 DİLLİ SEÇİCİ -->
  <div class="top-left-lang">
    <span>🌐 Language:</span>
    <select id="languageSelect" onchange="setLanguage(this.value)">
      <option value="en" selected>English (EN)</option>
      <option value="tr">Türkçe (TR)</option>
      <option value="de">Deutsch (DE)</option>
      <option value="es">Español (ES)</option>
      <option value="fr">Français (FR)</option>
      <option value="it">Italiano (IT)</option>
      <option value="pt">Português (PT)</option>
      <option value="ru">Русский (RU)</option>
      <option value="ar">العربية (AR)</option>
      <option value="zh">中文 (ZH)</option>
      <option value="ja">日本語 (JA)</option>
      <option value="ko">한국어 (KO)</option>
      <option value="nl">Nederlands (NL)</option>
      <option value="pl">Polski (PL)</option>
      <option value="uk">Українська (UK)</option>
      <option value="sv">Svenska (SV)</option>
      <option value="no">Norsk (NO)</option>
      <option value="da">Dansk (DA)</option>
      <option value="fi">Suomi (FI)</option>
      <option value="el">Ελληνικά (EL)</option>
      <option value="hi">हिन्दी (HI)</option>
      <option value="id">Bahasa Indonesia (ID)</option>
      <option value="ms">Bahasa Melayu (MS)</option>
      <option value="th">ไทย (TH)</option>
      <option value="vi">Tiếng Việt (VI)</option>
      <option value="cz">Čeština (CZ)</option>
      <option value="ro">Română (RO)</option>
      <option value="hu">Magyar (HU)</option>
      <option value="az">Azərbaycan (AZ)</option>
      <option value="fa">فارسی (FA)</option>
    </select>
  </div>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="auth-container">
    <div class="auth-card">
      <h1>CemTalk</h1>
      <p id="txt-subtitle">Please enter your account details to continue</p>
      
      <input type="text" id="input-user" placeholder="Email or Username">
      <input type="password" id="input-pass" placeholder="Password">
      <button id="btn-login" onclick="login()">Sign In</button>
      
      <div class="auth-toggle">
        <span id="txt-noaccount">Don't have an account? Sign Up</span>
      </div>
    </div>
  </div>

  <!-- MAIN CHAT APP SCREEN -->
  <div id="chatApp" class="chat-app">
    <div class="sidebar">
      <div style="font-weight:900; color:#c084fc;">CT</div>
    </div>
    <div class="chat-list">
      <div class="chat-list-header" id="txt-chats">Chats</div>
      <div style="padding: 15px; color: #94a3b8; font-size: 13px;">Julia Fischer (Online)</div>
    </div>
    <div class="chat-main">
      <div class="chat-header">
        <div>Julia Fischer</div>
      </div>
      <div class="chat-body" id="chatBody">
        <div class="msg-bubble msg-them">Hello! Welcome to CemTalk!</div>
      </div>
      <div class="chat-input">
        <input type="text" id="msgInput" placeholder="Type a message...">
        <button id="btn-send" onclick="sendMsg()">Send</button>
      </div>
    </div>
  </div>

  <script>
    const translations = {
      en: { subtitle: "Please enter your account details to continue", user: "Email or Username", pass: "Password", login: "Sign In", chats: "Chats", send: "Send", input: "Type a message..." },
      tr: { subtitle: "Devam etmek için hesap bilgilerinizi girin", user: "E-posta veya Kullanıcı Adı", pass: "Şifre", login: "Giriş Yap", chats: "Sohbetler", send: "Gönder", input: "Bir mesaj yaz..." },
      de: { subtitle: "Bitte gib deine Anmeldedaten ein", user: "E-Mail oder Benutzername", pass: "Passwort", login: "Anmelden", chats: "Chats", send: "Senden", input: "Nachricht schreiben..." },
      es: { subtitle: "Ingrese sus datos de cuenta para continuar", user: "Correo o Usuario", pass: "Contraseña", login: "Iniciar Sesión", chats: "Chats", send: "Enviar", input: "Escribe un mensaje..." },
      fr: { subtitle: "Saisissez vos identifiants pour continuer", user: "E-mail ou Identifiant", pass: "Mot de passe", login: "Se Connecter", chats: "Discussions", send: "Envoyer", input: "Écrivez un message..." },
      ru: { subtitle: "Введите данные вашей учетной записи", user: "Email или Имя пользователя", pass: "Пароль", login: "Войти", chats: "Чаты", send: "Отправить", input: "Введите сообщение..." },
      az: { subtitle: "Davam etmək üçün hesab məlumatlarınızı daxil edin", user: "E-poçt və ya İstifadəçi adı", pass: "Şifrə", login: "Daxil ol", chats: "Söhbətlər", send: "Göndər", input: "Mesaj yazın..." }
      // Dilerseniz yukarıdaki tüm 30 dil için özelleştirebilirsiniz
    };

    function setLanguage(lang) {
      const t = translations[lang] || translations['en'];
      document.getElementById('txt-subtitle').innerText = t.subtitle;
      document.getElementById('input-user').placeholder = t.user;
      document.getElementById('input-pass').placeholder = t.pass;
      document.getElementById('btn-login').innerText = t.login;
      document.getElementById('txt-chats').innerText = t.chats;
      document.getElementById('btn-send').innerText = t.send;
      document.getElementById('msgInput').placeholder = t.input;
    }

    function login() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('chatApp').style.display = 'flex';
    }

    function sendMsg() {
      const inp = document.getElementById('msgInput');
      if (!inp.value.trim()) return;
      const body = document.getElementById('chatBody');
      const msg = document.createElement('div');
      msg.className = 'msg-bubble msg-me';
      msg.innerText = inp.value;
      body.appendChild(msg);
      inp.value = '';
      body.scrollTop = body.scrollHeight;
    }
  </script>
</body>
</html>
