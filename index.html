<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #start-screen {
            text-align: center;
            z-index: 10;
        }

        #start-btn {
            background: #ff0033;
            border: none;
            color: white;
            padding: 20px 50px;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
        }

        .icon-preview {
            margin-top: 15px;
            font-size: 4rem;
        }

        #jumpscare-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #jumpscare-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Ekranda patlayan görseller */
        .gallery-popup {
            position: absolute;
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 3px solid #ff0033;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
            z-index: 99;
            animation: popIn 0.3s ease-out forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1) rotate(var(--rot)); opacity: 1; }
        }

        .shake {
            animation: shakeAnim 0.08s infinite;
        }

        @keyframes shakeAnim {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-12px, 12px); }
            50% { transform: translate(12px, -12px); }
            75% { transform: translate(-8px, 8px); }
            100% { transform: translate(8px, -8px); }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="icon-preview">🖼️</div>
        <br>
        <button id="start-btn" onclick="triggerPrank()">START</button>
    </div>

    <div id="jumpscare-screen">
        <img id="scare-img" src="1000038404.jpg" alt="Jumpscare">
    </div>

    <script>
        function triggerPrank() {
            document.getElementById('start-screen').style.display = 'none';
            
            const scareScreen = document.getElementById('jumpscare-screen');
            scareScreen.style.display = 'flex';
            scareScreen.classList.add('shake');

            const imageUrl = document.getElementById('scare-img').src;
            
            // 30 adet fotoğrafı ekrana dengeli ve akıcı bir şekilde dizersin
            let count = 0;
            const spamInterval = setInterval(() => {
                if (count >= 30) {
                    clearInterval(spamInterval);
                    return;
                }

                const img = document.createElement('img');
                img.src = imageUrl;
                img.className = 'gallery-popup';

                const randomX = Math.random() * (window.innerWidth - 120);
                const randomY = Math.random() * (window.innerHeight - 120);
                const randomRot = (Math.random() * 40 - 20) + 'deg';

                img.style.left = randomX + 'px';
                img.style.top = randomY + 'px';
                img.style.setProperty('--rot', randomRot);

                document.body.appendChild(img);
                count++;
            }, 40); // 40ms aralıklarla seri şekilde patlatır
        }
    </script>
</body>
</html>
