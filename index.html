<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ücretsiz AI Video</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --card:#f3f3f5; --accent:#6c47ff; --muted:#777; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121214; --fg:#f2f2f2; --card:#1e1e22; --muted:#999; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; max-width:640px; margin-inline:auto; }
  h1 { font-size:1.4rem; }
  label { display:block; margin:14px 0 6px; font-size:.9rem; color:var(--muted); }
  textarea, input { width:100%; padding:12px; border-radius:10px; border:1px solid #8884; background:var(--card); color:var(--fg); font-size:1rem; font-family:inherit; }
  textarea { min-height:130px; }
  button { margin-top:16px; width:100%; padding:14px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:1rem; font-weight:600; }
  button:disabled { opacity:.5; }
  #status { margin-top:14px; font-size:.9rem; color:var(--muted); min-height:1.2em; }
  canvas, video { width:100%; max-width:360px; display:block; margin:14px auto 0; border-radius:12px; background:#000; }
  a#dl { display:none; margin-top:10px; text-align:center; color:var(--accent); }
  small { color:var(--muted); }
</style>
</head>
<body>
<h1>🎬 Ücretsiz AI Video</h1>
<small>Her satır bir sahne. AI her satırdan bir resim çizer, sonra hepsi hareketli videoya çevrilir. Hesap/token gerekmez.</small>

<label for="prompts">Sahneler (satır başına bir tane, İngilizce daha iyi sonuç verir)</label>
<textarea id="prompts">a fox in a snowy forest, cinematic
the fox looks at the northern lights, cinematic
the fox runs toward a glowing cabin, cinematic</textarea>

<label for="secs">Sahne süresi (saniye)</label>
<input id="secs" type="number" value="3" min="1" max="8">

<button id="go">Video Üret</button>
<div id="status"></div>
<canvas id="cv" width="576" height="1024"></canvas>
<video id="out" controls playsinline style="display:none"></video>
<a id="dl" download="ai-video.webm">⬇ Videoyu indir</a>

<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const W = 576, H = 1024;

async function getImage(prompt, i) {
  const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) +
    `?width=${W}&height=${H}&nologo=true&seed=${Date.now() % 100000 + i}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Resim alınamadı (" + res.status + ")");
  return await createImageBitmap(await res.blob());
}

function drawFrame(ctx, img, t) { // t: 0..1, yavaş zoom
  const z = 1 + 0.15 * t;
  const w = W * z, h = H * z;
  ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
}

$("go").onclick = async () => {
  const prompts = $("prompts").value.split("\n").map(s => s.trim()).filter(Boolean);
  const secs = Math.max(1, Math.min(8, +$("secs").value || 3));
  if (!prompts.length) return;

  $("go").disabled = true;
  $("out").style.display = "none"; $("dl").style.display = "none";
  const imgs = [];

  try {
    for (let i = 0; i < prompts.length; i++) {
      $("status").textContent = `Resim ${i + 1}/${prompts.length} çiziliyor...`;
      imgs.push(await getImage(prompts[i], i));
      if (i < prompts.length - 1) {
        // Ücretsiz katman ~15 sn'de bir istek kabul ediyor
        for (let s = 16; s > 0; s--) {
          $("status").textContent = `Resim ${i + 1} tamam. Sonraki için ${s} sn bekleniyor...`;
          await sleep(1000);
        }
      }
    }

    $("status").textContent = "Video kaydediliyor...";
    const cv = $("cv"), ctx = cv.getContext("2d");
    const stream = cv.captureStream(30);
    const rec = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported("video/webm") ? "video/webm" : "" });
    const chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    const done = new Promise(r => rec.onstop = r);
    rec.start();

    for (const img of imgs) {
      const start = performance.now();
      while (true) {
        const t = (performance.now() - start) / (secs * 1000);
        if (t >= 1) break;
        drawFrame(ctx, img, t);
        await new Promise(r => requestAnimationFrame(r));
      }
    }
    rec.stop(); await done;

    const url = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
    $("out").src = url; $("out").style.display = "block";
    $("dl").href = url; $("dl").style.display = "block";
    $("status").textContent = "Hazır!";
  } catch (e) {
    $("status").textContent = "Hata: " + e.message + " (servis yoğun olabilir, tekrar dene)";
  } finally {
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
