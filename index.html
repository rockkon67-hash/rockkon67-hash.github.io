<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGD HUB - Ultra Fast Kahoot AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 460px;
            background: #141414;
            border: 2px solid #222;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 255, 204, 0.05);
        }
        h1 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 4px;
            background: linear-gradient(45deg, #00ffcc, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            font-size: 11px;
            color: #777;
            margin-bottom: 20px;
            letter-spacing: 1.5px;
        }
        .card {
            background: #1c1c1c;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .card h2 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #00ffcc;
        }
        input, textarea {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #444;
            color: #00ffcc;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        textarea {
            height: 70px;
            resize: none;
            font-family: monospace;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00ffcc, #0099ff);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.1s;
            font-size: 14px;
        }
        button:active {
            transform: scale(0.97);
        }
        .game-panel {
            display: none;
        }
        .q-display {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 12px;
            min-height: 40px;
            color: #ddd;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .opt-btn {
            padding: 14px;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid transparent;
            color: white;
            cursor: pointer;
            font-size: 13px;
        }
        .opt-0 { background: #e21b3c; } 
        .opt-1 { background: #1368ce; } 
        .opt-2 { background: #d89e00; } 
        .opt-3 { background: #26890d; } 
        
        .opt-btn.correct {
            border: 3px solid #ffffff;
            box-shadow: 0 0 20px #00ff00;
            transform: scale(1.05);
        }
        .opt-btn.dimmed {
            opacity: 0.2;
        }
        .status {
            text-align: center;
            font-size: 12px;
            color: #00ff00;
            margin-top: 8px;
            min-height: 16px;
        }
        .footer {
            text-align: center;
            font-size: 10px;
            color: #444;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MGD HUB</h1>
        <div class="subtitle">ULTRA FAST AI SOLVER</div>

        <!-- 1. GİRİŞ EKRANI -->
        <div id="loginScreen" class="card">
            <h2>🎮 Oyun Girişi</h2>
            <input type="text" id="gamePin" placeholder="Game PIN (ID)..." style="text-align:center;">
            <input type="text" id="nickname" placeholder="Takma Ad (Nick)..." style="text-align:center; margin-bottom: 12px;">
            <button onclick="connectGame()">Hızlı Bağlan ⚡</button>
            <div class="status" id="loginStatus"></div>
        </div>

        <!-- 2. OYUN EKRANI -->
        <div id="gameScreen" class="game-panel">
            <div class="card">
                <h2>⚡ Anlık Soru Yakalayıcı</h2>
                <textarea id="questionInput" placeholder="Soruyu ve şıkları buraya yapıştır (Anında çözer)..." oninput="autoTriggerSolve()"></textarea>
            </div>

            <div class="card">
                <h2>🎯 Doğru Cevap (Anında)</h2>
                <div class="q-display" id="activeQuestionText">Soru bekleniyor...</div>
                <div class="options-grid">
                    <button class="opt-btn opt-0" id="b0">1. Şık</button>
                    <button class="opt-btn opt-1" id="b1">2. Şık</button>
                    <button class="opt-btn opt-2" id="b2">3. Şık</button>
                    <button class="opt-btn opt-3" id="b3">4. Şık</button>
                </div>
                <div class="status" id="aiStatus" style="color: #00ffcc;">Hazır 🚀</div>
            </div>

            <button onclick="resetApp()" style="background: #222; color: #ff4444; border: 1px solid #ff4444; font-size: 12px; padding: 8px;">Çıkış Yap</button>
        </div>

        <div class="footer">MGD Systems &copy; 2026</div>
    </div>

    <script>
        // Senin gönderdiğin anahtar doğrudan buraya entegre edildi kanka
        const apiKey = "AQ.Ab8RN6JJAvXT24-2-xm-8u4TgPg-hkVi50FKl26UnQqW2y86ug";
        let gamePin = "";
        let nickname = "";
        let lastCheckedText = "";

        function connectGame() {
            gamePin = document.getElementById('gamePin').value.trim();
            nickname = document.getElementById('nickname').value.trim();

            if (!gamePin || !nickname) {
                document.getElementById('loginStatus').innerText = "⚠ PIN veya Nick boş olamaz kanka!";
                return;
            }

            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('aiStatus').innerText = `Bağlandı! PIN: ${gamePin}`;
        }

        async function autoTriggerSolve() {
            const rawText = document.getElementById('questionInput').value.trim();
            if (rawText.length < 3 || rawText === lastCheckedText) return;
            
            lastCheckedText = rawText;
            document.getElementById('aiStatus').innerText = "⚡ Hızlıca çözülüyor...";

            const MODEL_NAME = "gemini-2.5-flash";
            const prompt = `Sadece doğru şıkkın numarasını (1, 2, 3 veya 4) rakam olarak yaz. Başka hiçbir şey yazma.\n\n${rawText}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                
                if (data.error) {
                    document.getElementById('aiStatus').innerText = "❌ API Hatası: Geçersiz anahtar!";
                    return;
                }

                const aiText = data.candidates[0].content.parts[0].text.trim();
                const match = aiText.match(/[1-4]/);

                if (match) {
                    const correctIndex = parseInt(match[0]) - 1;
                    highlightCorrectOption(correctIndex);
                    document.getElementById('activeQuestionText').innerText = "Çözüldü: " + rawText.split('\n')[0];
                    document.getElementById('aiStatus').innerText = `🚀 Doğru Şık: ${correctIndex + 1}`;
                }
            } catch (error) {
                document.getElementById('aiStatus').innerText = "❌ Bağlantı Hatası!";
            }
        }

        function highlightCorrectOption(index) {
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`b${i}`);
                btn.classList.remove('correct', 'dimmed');
                if (i === index) {
                    btn.classList.add('correct');
                } else {
                    btn.classList.add('dimmed');
                }
            }
        }

        function resetApp() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('questionInput').value = '';
            lastCheckedText = "";
            for (let i = 0; i < 4; i++) {
                document.getElementById(`b${i}`).classList.remove('correct', 'dimmed');
            }
        }
    </script>

</body>
</html>
