<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmet Modu v4 - 100 Gerçek</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: 1;
      transform: translate(-50%, -50%);
      opacity: 0.35;
      object-fit: cover;
    }

    .card {
      position: relative;
      z-index: 2;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 600px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 35px rgba(255, 71, 87, 0.6);
      border: 2px solid #ff4757;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: #ff4757;
      text-transform: uppercase;
    }

    .badge {
      display: inline-block;
      background-color: #ffa502;
      color: #000;
      font-weight: bold;
      padding: 4px 14px;
      border-radius: 15px;
      font-size: 0.85rem;
      margin-bottom: 15px;
    }

    .quote-box {
      font-size: 1.3rem;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 15px 0;
      padding: 20px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      border-left: 5px solid #ff4757;
      line-height: 1.5;
    }

    button {
      background-color: #ff4757;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
    }

    button:hover {
      background-color: #ff6b81;
      transform: scale(1.05);
    }

    .counter {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <!-- Arka Plan Videosu -->
  <video class="bg-video" id="myVideo" loop muted playsinline>
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
  </video>

  <!-- Arka Plan Sesi -->
  <audio id="myAudio" loop>
    <source src="ses.mp3" type="audio/mpeg">
  </audio>

  <div class="card">
    <h1>Ahmet Gerçekleri</h1>
    <div class="badge">100 / 100 NOOB KAPASİTESİ</div>
    
    <div class="quote-box" id="quote">
      Başlatmak ve 100 efsane mesajı görmek için butona bas!
    </div>

    <button onclick="baslatVeDegistir()">Sesi Aç & Mesaj Değiştir</button>
    <div class="counter" id="counter">Gösterilen Mesaj: 0 / 100</div>
  </div>

      "97. Ahmet'in oyundaki adı 'Kral_Ahmet' ama oyundaki rolü kurban.",

      "99. Ahmet'in bilgisayarı bile Ahmet oyunu açınca fanları son hız çalıştırıp ağlıyor.",
      "100. VE SON GERÇEK: Ahmet ne kadar denese de efsanevi bir NOOB olarak kalacak!"
    ];

    let basladi = false;
    let tiklama = 0;

    function baslatVeDegistir() {
      const audio = document.getElementById('myAudio');
      const video = document.getElementById('myVideo');

      if (!basladi) {
        audio.play().catch(e => console.log("Ses hatası:", e));
        video.play();
        basladi = true;
      }

      tiklama++;
      const rastgeleIndex = Math.floor(Math.random() * mesajlar.length);
      document.getElementById('quote').innerText = mesajlar[rastgeleIndex];
      document.getElementById('counter').innerText = "Gösterilen Mesaj Tıklama Sayısı: " + tiklama;
    }
  </script>

</body>
</html>
