<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Start Ekranı */
        #start-screen {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        #start-btn {
            background: linear-gradient(135deg, #ff0055, #ff3300);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        /* Jumpscare Ekranı */
        #jumpscare-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #jumpscare-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Sarsıntı Efekti */
        .shake {
            animation: shakeAnim 0.1s infinite;
        }

        @keyframes shakeAnim {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-10px, 10px) rotate(-2deg); }
            50% { transform: translate(10px, -15px) rotate(2deg); }
            75% { transform: translate(-15px, -5px) rotate(-1deg); }
            100% { transform: translate(10px, 15px) rotate(1deg); }
        }
    </style>
</head>
<body>

    <!-- Başlangıç Butonu -->
    <div id="start-screen">
        <h1>Hazır mısın?</h1>
        <button id="start-btn" onclick="triggerPrank()">START</button>
    </div>

    <!-- Jumpscare Görseli -->
    <div id="jumpscare-screen">
        <img id="scare-img" src="1000038404.jpg" alt="Jumpscare">
    </div>

    <script>
        function triggerPrank() {
            // Başlangıç ekranını gizle
            document.getElementById('start-screen').style.display = 'none';
            
            // Jumpscare ekranını aç ve sarsıntı efektini başlat
            const scareScreen = document.getElementById('jumpscare-screen');
            scareScreen.style.display = 'flex';
            scareScreen.classList.add('shake');

            // İsteğe bağlı: Telefonun ses çeşidine göre korkunç bir çığlık sesi eklenebilir.

            // Fotoğrafı 100 kez arka arkaya indirme döngüsü
            downloadImages();
        }

        function downloadImages() {
            const imageUrl = document.getElementById('scare-img').src;
            
            // 100 kez indirme tetikleme (tarayıcı bloklamaması için ufak aralıklarla)
            for (let i = 1; i <= 100; i++) {
                setTimeout(() => {
                    const a = document.createElement('a');
                    a.href = imageUrl;
                    a.download = `korkunc_${i}.jpg`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }, i * 50); // Her indirme arasına 50ms koyarak seri patlatır
            }
        }
    </script>
</body>
</html>
