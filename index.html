<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CemTalk - Canlı Mesajlaşma</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-panel: #111827;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-chat: #0b0f19;
            --bg-bubble-user: linear-gradient(135deg, #2563eb, #1d4ed8);
            --bg-bubble-other: #1e293b;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        #appLoader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #060911; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .spinner-outer {
            width: 60px; height: 60px; border-radius: 50%; border: 3px solid transparent;
            border-top-color: var(--primary); border-right-color: var(--accent-purple);
            animation: spin 1s linear infinite; display: flex; align-items: center; justify-content: center;
        }
        .spinner-inner { width: 35px; height: 35px; border-radius: 50%; border: 3px solid transparent; border-bottom-color: var(--accent-green); animation: spin-reverse 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }

        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(17, 24, 39, 0.95), rgba(9, 13, 22, 0.98));
            backdrop-filter: blur(12px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .auth-card {
            background: var(--bg-card); border: 1px solid var(--border-color); padding: 32px; border-radius: 24px;
            width: 100%; max-width: 420px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .auth-card h2 {
            font-size: 2rem; font-weight: 900; background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px;
        }
        .auth-tabs { display: flex; margin: 20px 0; background: rgba(15, 23, 42, 0.6); padding: 4px; border-radius: 12px; border: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 8px 4px; background: none; border: none; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 0 12px var(--primary-glow); }
        .tab-btn.admin-tab.active { background: var(--accent-purple); }
        
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
        .auth-input { width: 100%; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 14px; color: white; outline: none; font-size: 0.9rem; }
        .btn-submit { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .error-msg { color: var(--accent-red); font-size: 0.85rem; margin-top: 10px; display: none; background: rgba(239, 68, 68, 0.1); padding: 8px; border-radius: 8px; }

        .app-nav { width: 68px; background: #070a12; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding-top: 16px; gap: 16px; }
        .nav-icon { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; transition: 0.2s; font-size: 1.1rem; }
        .nav-icon.active { background: var(--primary); color: white; box-shadow: 0 0 12px var(--primary-glow); }

        .sidebar { width: 320px; background: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .user-header { padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.4); }
        .avatar { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), #1d4ed8); display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; flex-shrink: 0; }
        
        .chat-list { flex: 1; overflow-y: auto; }

        .main-chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); position: relative; }
        .chat-header { height: 68px; padding: 0 20px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message-bubble { max-width: 65%; padding: 12px 16px; border-radius: 16px; font-size: 0.92rem; line-height: 1.4; word-break: break-word; }
        .message-bubble.incoming { align-self: flex-start; background: var(--bg-bubble-other); border-bottom-left-radius: 4px; }
        .message-bubble.outgoing { align-self: flex-end; background: var(--bg-bubble-user); border-bottom-right-radius: 4px; }
        .message-bubble img { max-width: 100%; border-radius: 12px; margin-top: 5px; }
        .message-time { font-size: 0.68rem; opacity: 0.7; margin-top: 4px; text-align: right; }

        .chat-input-area { padding: 16px; background: var(--bg-panel); border-top: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; position: relative; }
        .chat-input { flex: 1; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px 16px; color: white; outline: none; font-size: 0.95rem; }

        .btn-icon { width: 40px; height: 40px; border-radius: 12px; border: none; background: rgba(255, 255, 255, 0.05); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; transition: 0.2s; flex-shrink: 0; }
        .btn-icon:hover { background: rgba(255, 255, 255, 0.12); }

        /* STICKER PANELI */
        .sticker-picker {
            position: absolute; bottom: 75px; left: 16px; background: var(--bg-panel); border: 1px solid var(--border-color);
            padding: 12px; border-radius: 16px; display: none; grid-template-columns: repeat(4, 1fr); gap: 10px; font-size: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 100;
        }
        .sticker-item { cursor: pointer; text-align: center; transition: transform 0.2s; }
        .sticker-item:hover { transform: scale(1.2); }

        /* ARAMA VE VİDEO MODALI */
        .call-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9);
            z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .video-container { display: flex; gap: 20px; margin-bottom: 20px; }
        video { width: 320px; height: 240px; background: #000; border-radius: 16px; border: 2px solid var(--border-color); object-fit: cover; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 3000; display: none; align-items: center; justify-content: center; }
        .modal-card { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 28px; border-radius: 20px; width: 420px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .admin-user-item { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.8); padding: 12px 16px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border-color); text-align: left; }
    </style>
</head>
<body>

    <div id="appLoader">
        <div class="spinner-outer"><div class="spinner-inner"></div></div>
        <h3 style="margin-top: 15px; color: var(--primary); font-weight: 800; letter-spacing: 2px;">CEMTALK</h3>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">Ağ Sinyali Kuruluyor...</p>
    </div>

    <!-- GİRİŞ EKRANI -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card">
            <h2>CemTalk</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Anlık Mesajlaşma Platformu</p>

            <div class="auth-tabs">
                <button class="tab-btn active" id="tabLoginBtn">Giriş Yap</button>
                <button class="tab-btn" id="tabRegisterBtn">Kayıt Ol</button>
                <button class="tab-btn admin-tab" id="tabAdminBtn"><i class="fas fa-shield-alt"></i> Admin</button>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="loginUsername" class="auth-input" required>
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="loginPassword" class="auth-input" required>
                </div>
                <button type="submit" class="btn-submit"><i class="fas fa-sign-in-alt"></i> Giriş Yap</button>
            </form>

            <form id="registerForm" style="display: none;">
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="regUsername" class="auth-input" required>
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="regPassword" class="auth-input" required>
                </div>
                <button type="submit" class="btn-submit" style="background: linear-gradient(135deg, var(--accent-green), #059669);"><i class="fas fa-user-plus"></i> Hesap Oluştur</button>
            </form>

            <form id="adminForm" style="display: none;">
                <div class="form-group">
                    <label>Kullanıcı Adınız</label>
                    <input type="text" id="adminUsername" class="auth-input" required>
                </div>
                <div class="form-group">
                    <label>Admin Şifresi</label>
                    <input type="password" id="adminKeyInput" class="auth-input" placeholder="Şifrenizi girin..." required>
                </div>
                <button type="submit" class="btn-submit" style="background: linear-gradient(135deg, var(--accent-purple), #7c3aed);"><i class="fas fa-lock"></i> Admin Paneline Giriş Yap</button>
            </form>

            <div class="error-msg" id="errorMsg"></div>
        </div>
    </div>

    <!-- ARAMA MODALI -->
    <div class="call-modal" id="callModal">
        <h3 id="callStatusText" style="margin-bottom: 20px; color: #fff;">Aranıyor...</h3>
        <div class="video-container">
            <video id="localVideo" autoplay muted></video>
            <video id="remoteVideo" autoplay></video>
        </div>
        <button class="btn-icon" style="background: var(--accent-red); width: 60px; height: 60px; border-radius: 50%; font-size: 1.5rem;" onclick="endCall()"><i class="fas fa-phone-slash"></i></button>
    </div>

    <div class="app-nav">
        <div class="nav-icon active"><i class="fas fa-comment-dots"></i></div>
    </div>

    <div class="sidebar">
        <div class="user-header">
            <div style="display: flex; align-items: center; gap: 10px; overflow: hidden;">
                <div class="avatar" id="myAvatar">?</div>
                <div style="overflow: hidden;">
                    <div id="myProfileName" style="font-weight: 700; font-size:0.9rem;">Giriş Yapılmadı</div>
                    <div id="myProfileId" style="font-size: 0.75rem; color: #38bdf8; cursor: pointer;" onclick="copyMyId()" title="Kopyalamak için tıkla">ID: Sunucuya Bağlanılıyor... <i class="fas fa-copy"></i></div>
                </div>
            </div>
            <div style="display: flex; gap: 6px;">
                <button class="btn-icon" id="adminBtn" title="Admin Paneli" style="display: none; background: var(--accent-purple);" onclick="openAdminModal()"><i class="fas fa-shield-alt"></i></button>
                <button class="btn-icon" title="Çıkış Yap" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <div style="padding: 12px; display: flex; gap: 8px;">
            <input type="text" id="friendIdInput" class="auth-input" style="font-size: 0.8rem;" placeholder="Arkadaşının ID'sini yaz...">
            <button class="btn-icon" style="background: var(--primary);" onclick="connectToFriend()" title="Bağlan"><i class="fas fa-plug"></i></button>
        </div>

        <div class="chat-list" id="chatListContainer">
            <div style="padding:15px; color:var(--text-muted); font-size:0.8rem; text-align:center;">
                Yukarıdaki kutuya arkadaşının ID'sini yazıp fiş butonuna basarak anında bağlanabilirsin.
            </div>
        </div>
    </div>

    <div class="main-chat-area">
        <div class="chat-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="avatar" id="activeAvatar">?</div>
                <div>
                    <div id="activeChatName" style="font-weight: 700;">Henüz Bağlantı Yok</div>
                    <div id="activeChatSub" style="font-size: 0.75rem; color: var(--text-muted);">Bağlantı Bekleniyor</div>
                </div>
            </div>
            <!-- ARAMA BUTONLARI -->
            <div style="display: flex; gap: 10px;">
                <button class="btn-icon" style="background: var(--accent-green);" onclick="startCall(false)" title="Sesli Arama"><i class="fas fa-phone"></i></button>
                <button class="btn-icon" style="background: var(--primary);" onclick="startCall(true)" title="Görüntülü Arama"><i class="fas fa-video"></i></button>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer"></div>

        <!-- STICKER PANELI -->
        <div class="sticker-picker" id="stickerPicker">
            <div class="sticker-item" onclick="sendSticker('🔥')">🔥</div>
            <div class="sticker-item" onclick="sendSticker('😂')">😂</div>
            <div class="sticker-item" onclick="sendSticker('👍')">👍</div>
            <div class="sticker-item" onclick="sendSticker('❤️')">❤️</div>
            <div class="sticker-item" onclick="sendSticker('😎')">😎</div>
            <div class="sticker-item" onclick="sendSticker('🎉')">🎉</div>
            <div class="sticker-item" onclick="sendSticker('💀')">💀</div>
            <div class="sticker-item" onclick="sendSticker('🚀')">🚀</div>
        </div>

        <div class="chat-input-area">
            <button class="btn-icon" onclick="toggleStickers()" title="Sticker"><i class="fas fa-smile"></i></button>
            <button class="btn-icon" onclick="document.getElementById('imageInput').click()" title="Fotoğraf Gönder"><i class="fas fa-image"></i></button>
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="sendImage(this)">
            
            <input type="text" class="chat-input" id="messageInput" placeholder="Mesajınızı yazın..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn-icon" style="background: var(--primary);" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div class="modal-overlay" id="adminModal">
        <div class="modal-card" style="width: 480px;">
            <h3 style="margin-bottom: 12px; color: var(--accent-purple);"><i class="fas fa-user-shield"></i> Admin Paneli</h3>
            <div id="adminUserList" style="max-height: 300px; overflow-y: auto; margin-bottom: 16px;"></div>
            <button onclick="closeModal('adminModal')" class="btn-submit" style="background:#334155;">Kapat</button>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let mediaCall = null;
        let localStream = null;
        let currentUser = null;
        let currentUserId = null;
        let isAdmin = false;

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('appLoader').style.opacity = '0';
                document.getElementById('appLoader').style.visibility = 'hidden';
            }, 500);
        });

        const tabLoginBtn = document.getElementById('tabLoginBtn');
        const tabRegisterBtn = document.getElementById('tabRegisterBtn');
        const tabAdminBtn = document.getElementById('tabAdminBtn');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const adminForm = document.getElementById('adminForm');
        const errorMsg = document.getElementById('errorMsg');

        tabLoginBtn.onclick = () => showTab(tabLoginBtn, loginForm);
        tabRegisterBtn.onclick = () => showTab(tabRegisterBtn, registerForm);
        tabAdminBtn.onclick = () => showTab(tabAdminBtn, adminForm);

        function showTab(btn, form) {
            [tabLoginBtn, tabRegisterBtn, tabAdminBtn].forEach(b => b.classList.remove('active'));
            [loginForm, registerForm, adminForm].forEach(f => f.style.display = 'none');
            btn.classList.add('active');
            form.style.display = 'block';
            showError('');
        }

        function showError(msg) {
            if (msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; }
            else { errorMsg.style.display = 'none'; }
        }

        function getUsers() { return JSON.parse(localStorage.getItem('cemtalk_users') || '{}'); }

        registerForm.onsubmit = (e) => {
            e.preventDefault();
            const u = document.getElementById('regUsername').value.trim();
            const p = document.getElementById('regPassword').value;
            const users = getUsers();

            if (users[u]) return showError('Bu kullanıcı adı alınmış!');

            const newId = 'cemtalk-' + Math.floor(100000 + Math.random() * 900000).toString();
            users[u] = { password: p, userId: newId, isAdmin: false };
            localStorage.setItem('cemtalk_users', JSON.stringify(users));

            alert(`Hesap Oluşturuldu!\nID Numaranız: ${newId}`);
            showTab(tabLoginBtn, loginForm);
        };

        loginForm.onsubmit = (e) => {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value;
            const users = getUsers();

            if (!users[u] || users[u].password !== p) return showError('Kullanıcı adı veya şifre yanlış!');
            loginSuccess(u, users[u]);
        };

        adminForm.onsubmit = (e) => {
            e.preventDefault();
            const u = document.getElementById('adminUsername').value.trim();
            const key = document.getElementById('adminKeyInput').value.trim().toLowerCase();

            if (['cinar', 'çınar', 'cem'].includes(key)) {
                const users = getUsers();
                if (!users[u]) {
                    const newId = 'cemtalk-' + Math.floor(100000 + Math.random() * 900000).toString();
                    users[u] = { password: key, userId: newId, isAdmin: true };
                } else {
                    users[u].isAdmin = true;
                }
                localStorage.setItem('cemtalk_users', JSON.stringify(users));
                loginSuccess(u, users[u]);
            } else {
                showError('Geçersiz Admin Şifresi!');
            }
        };

        function loginSuccess(username, userData) {
            currentUser = username;
            currentUserId = userData.userId;
            isAdmin = userData.isAdmin || false;

            document.getElementById('myProfileName').innerText = currentUser;
            document.getElementById('myAvatar').innerText = currentUser.substring(0, 2).toUpperCase();
            document.getElementById('adminBtn').style.display = isAdmin ? 'flex' : 'none';
            document.getElementById('authOverlay').style.display = 'none';

            initPeer();
        }

        function initPeer() {
            peer = new Peer(currentUserId, {
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                document.getElementById('myProfileId').innerHTML = `ID: #${id} <i class="fas fa-copy"></i>`;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnectionUI();
            });

            // GELEN ARAMALARI YAKALAMA
            peer.on('call', (call) => {
                if (confirm('Gelen arama var, kabul ediyor musunuz?')) {
                    navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
                        localStream = stream;
                        document.getElementById('localVideo').srcObject = stream;
                        document.getElementById('callModal').style.display = 'flex';
                        document.getElementById('callStatusText').innerText = 'Görüşme Başladı';
                        
                        call.answer(stream);
                        mediaCall = call;

                        call.on('stream', (remoteStream) => {
                            document.getElementById('remoteVideo').srcObject = remoteStream;
                        });
                    });
                }
            });
        }

        window.connectToFriend = () => {
            const friendId = document.getElementById('friendIdInput').value.trim().replace('#', '');
            if (!friendId) return alert('Lütfen bir ID girin!');
            if (friendId === currentUserId) return alert('Kendi ID numaranıza bağlanamazsınız!');

            document.getElementById('activeChatSub').innerText = "Bağlantı Kuruluyor...";
            conn = peer.connect(friendId, { reliable: true });
            setupConnectionUI();
        };

        function setupConnectionUI() {
            if (!conn) return;

            conn.on('open', () => {
                document.getElementById('activeChatName').innerText = `Kullanıcı (${conn.peer})`;
                document.getElementById('activeChatSub').innerText = "🟢 Canlı Bağlantı Kuruldu";
                document.getElementById('activeChatSub').style.color = "var(--accent-green)";
                document.getElementById('activeAvatar').innerText = "C";
            });

            conn.on('data', (data) => {
                if (typeof data === 'object') {
                    if (data.type === 'image') appendImageMessage(data.content, 'incoming');
                    if (data.type === 'sticker') appendMessage(data.content, 'incoming', true);
                } else {
                    appendMessage(data, 'incoming');
                }
            });
        }

        // MESAJ GÖNDERME
        window.sendMessage = () => {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            if (!conn || !conn.open) return alert('Henüz canlı bağlantı kurulmadı!');

            conn.send(text);
            appendMessage(text, 'outgoing');
            input.value = '';
        };

        // FOTOĞRAF GÖNDERME
        window.sendImage = (input) => {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const imgData = e.target.result;
                if (conn && conn.open) {
                    conn.send({ type: 'image', content: imgData });
                    appendImageMessage(imgData, 'outgoing');
                } else {
                    alert('Önce bir kullanıcıya bağlanmalısınız!');
                }
            };
            reader.readAsDataURL(file);
        };

        // STICKER GÖNDERME
        window.toggleStickers = () => {
            const picker = document.getElementById('stickerPicker');
            picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
        };

        window.sendSticker = (sticker) => {
            if (!conn || !conn.open) return alert('Önce bir kullanıcıya bağlanmalısınız!');
            conn.send({ type: 'sticker', content: sticker });
            appendMessage(sticker, 'outgoing', true);
            document.getElementById('stickerPicker').style.display = 'none';
        };

        // SESLİ / GÖRÜNTÜLÜ ARAMA BAŞLATMA
        window.startCall = (isVideo) => {
            if (!conn || !conn.open) return alert('Arama yapmak için önce bir kullanıcıya bağlanmalısınız!');

            navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true }).then((stream) => {
                localStream = stream;
                document.getElementById('localVideo').srcObject = stream;
                document.getElementById('callModal').style.display = 'flex';
                document.getElementById('callStatusText').innerText = 'Aranıyor...';

                mediaCall = peer.call(conn.peer, stream);

                mediaCall.on('stream', (remoteStream) => {
                    document.getElementById('callStatusText').innerText = 'Görüşme Başladı';
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                });
            }).catch(err => {
                alert('Kamera veya mikrofon izni verilmedi!');
            });
        };

        window.endCall = () => {
            if (mediaCall) mediaCall.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            document.getElementById('callModal').style.display = 'none';
        };

        function appendMessage(text, type, isSticker = false) {
            const container = document.getElementById('messagesContainer');
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msg = document.createElement('div');
            msg.className = `message-bubble ${type}`;
            if (isSticker) msg.style.fontSize = '3rem';
            msg.innerHTML = `${text}<div class="message-time">${time}</div>`;
            
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        function appendImageMessage(src, type) {
            const container = document.getElementById('messagesContainer');
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msg = document.createElement('div');
            msg.className = `message-bubble ${type}`;
            msg.innerHTML = `<img src="${src}"><div class="message-time">${time}</div>`;
            
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        window.copyMyId = () => {
            if (!currentUserId) return alert('Henüz ID oluşturulmadı.');
            navigator.clipboard.writeText(currentUserId);
            alert('ID Numaran kopyalandı: ' + currentUserId);
        };

        window.openAdminModal = () => {
            if (!isAdmin) return;
            const users = getUsers();
            const list = document.getElementById('adminUserList');
            list.innerHTML = '';

            for (let u in users) {
                const div = document.createElement('div');
                div.className = 'admin-user-item';
                div.innerHTML = `<div><strong style="color:#fff;">${u}</strong> <span style="font-size:0.75rem; color:#38bdf8;">(#${users[u].userId})</span><div style="font-size:0.8rem; color:#f59e0b;">Şifre: ${users[u].password}</div></div>`;
                list.appendChild(div);
            }
            document.getElementById('adminModal').style.display = 'flex';
        };

        window.closeModal = (id) => document.getElementById(id).style.display = 'none';
        window.logout = () => location.reload();
    </script>
</body>
</html>
