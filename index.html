<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Ultimate Script & Whitelist Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-600/30">
                    <i class="fa-solid fa-shield-halved text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Roblox Script Studio</h1>
                    <p class="text-xs text-slate-400">All-in-One Loadstring, Whitelist & Time-Lock Generator</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    v2.5 Full Edition
                </span>
            </div>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Sol Panel: Script Ayarları ve Kod -->
        <section class="lg:col-span-7 flex flex-col gap-5">
            
            <!-- Quick Presets -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2.5 block">
                    <i class="fa-solid fa-bolt text-yellow-400 mr-1"></i> Hazır Script Şablonları (Presets)
                </label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="loadPreset('print')" class="bg-slate-800/80 hover:bg-slate-700 text-slate-200 py-2 px-3 rounded-lg text-xs font-medium transition border border-slate-700/50 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-terminal text-blue-400"></i> Print Test
                    </button>
                    <button onclick="loadPreset('speed')" class="bg-slate-800/80 hover:bg-slate-700 text-slate-200 py-2 px-3 rounded-lg text-xs font-medium transition border border-slate-700/50 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-gauge-high text-emerald-400"></i> Speed Hack
                    </button>
                    <button onclick="loadPreset('gui')" class="bg-slate-800/80 hover:bg-slate-700 text-slate-200 py-2 px-3 rounded-lg text-xs font-medium transition border border-slate-700/50 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-window-restore text-purple-400"></i> Test GUI
                    </button>
                </div>
            </div>

            <!-- Code Editor Box -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col gap-3 shadow-lg">
                <div class="flex items-center justify-between">
                    <label class="text-sm font-semibold flex items-center gap-2 text-slate-200">
                        <i class="fa-solid fa-code text-blue-400"></i> Lua Script Kodu
                    </label>
                    <button onclick="document.getElementById('rawScript').value=''" class="text-xs text-slate-400 hover:text-rose-400 transition">Temizle</button>
                </div>
                <textarea id="rawScript" rows="7" placeholder="-- Scriptinizi buraya yapıştırın veya yukarıdan şablon seçin..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm font-mono text-slate-200 focus:outline-none focus:border-blue-500 transition resize-none"></textarea>
            </div>

            <!-- Whitelist & Advanced Settings -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col gap-4 shadow-lg">
                <h2 class="text-sm font-semibold text-slate-200 border-b border-slate-800 pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-blue-400"></i> Koruma & Whitelist Özellikleri
                </h2>

                <!-- Whitelist Input -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">
                        İzin Verilen Kullanıcılar (Username veya UserId - Virgülle Ayırın)
                    </label>
                    <input type="text" id="whitelistUsers" placeholder="Örn: Ahmet, Ali, 12345678" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                </div>

                <!-- Settings Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Time Lock -->
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Süre Sınırı (Time-Lock)</label>
                        <select id="timeLock" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                            <option value="none">Süresiz (Sınırsız)</option>
                            <option value="1h">1 Saat</option>
                            <option value="24h" selected>24 Saat (1 Gün)</option>
                            <option value="7d">7 Gün</option>
                            <option value="30d">30 Gün</option>
                        </select>
                    </div>

                    <!-- Unauthorized Action -->
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">İzinsiz Kullanıcı Eylemi</label>
                        <select id="kickAction" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                            <option value="kick">Oyundan At (Kick)</option>
                            <option value="error">Hata Ver (Error / Stop)</option>
                            <option value="notify">Ekrana Bildirim Çıkar</option>
                        </select>
                    </div>
                </div>

                <!-- Custom Notification Title -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Oyunda Görünecek Açılış Bildirimi (Opsiyonel)</label>
                    <input type="text" id="customNotify" placeholder="Örn: Script Başarıyla Yüklendi!" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                </div>

                <!-- Toggles -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2 border-t border-slate-800/60">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-medium text-slate-300">Source Lock (Kod Gizleme)</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="obfuscateCheck" class="sr-only peer" checked>
                            <div class="w-9 h-5 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-medium text-slate-300">pcall() Güvenlik Sarmalı</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="pcallCheck" class="sr-only peer" checked>
                            <div class="w-9 h-5 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Generate Action -->
            <button onclick="generateScript()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3.5 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-blue-600/25 active:scale-[0.99]">
                <i class="fa-solid fa-wand-magic-sparkles"></i> RAW Link & Loadstring Oluştur
            </button>
        </section>

        <!-- Sağ Panel: Çıktı ve Kopyalama -->
        <section class="lg:col-span-5 flex flex-col gap-5">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col gap-4 shadow-lg h-full">
                <h2 class="text-sm font-semibold text-slate-200 border-b border-slate-800 pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-square-poll-vertical text-blue-400"></i> Üretilen Kod & Linkler
                </h2>

                <!-- RAW URL Output -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Canlı RAW URL (Canlı Link)</label>
                    <div class="flex gap-2">
                        <input type="text" id="rawUrlOutput" readonly placeholder="Henüz oluşturulmadı..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs font-mono text-emerald-400 focus:outline-none">
                        <button onclick="copyToClipboard('rawUrlOutput')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg text-xs transition">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>

                <!-- Final Loadstring Output -->
                <div class="flex-1 flex flex-col min-h-[220px]">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Roblox Executor Kodu (Loadstring)</label>
                    <textarea id="finalLoadstring" readonly placeholder="Sonuç koda dönüştürüldüğünde burada görünecek..." class="w-full flex-1 bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs font-mono text-blue-300 focus:outline-none resize-none"></textarea>
                </div>

                <!-- Copy Main Button -->
                <button onclick="copyToClipboard('finalLoadstring')" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 border border-slate-700">
                    <i class="fa-regular fa-copy"></i> Loadstring'i Kopyala
                </button>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-emerald-600 text-white px-4 py-2.5 rounded-xl shadow-2xl text-sm font-medium transition transform translate-y-20 opacity-0 flex items-center gap-2 pointer-events-none z-50">
        <i class="fa-solid fa-circle-check"></i> <span id="toastMsg">Kopyalandı!</span>
    </div>

    <!-- Script Logic -->
    <script>
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        function copyToClipboard(elementId) {
            const copyText = document.getElementById(elementId);
            if (!copyText.value) return;
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            showToast('Başarıyla Kopyalandı!');
        }

        function loadPreset(type) {
            const editor = document.getElementById('rawScript');
            if(type === 'print') {
                editor.value = `print("Script Başarıyla Çalıştı!")\nwarn("Kullanıcı Yetkilendirildi!")`;
            } else if(type === 'speed') {
                editor.value = `local player = game.Players.LocalPlayer\nif player and player.Character then\n    player.Character.Humanoid.WalkSpeed = 50\n    print("Hız 50 yapıldı!")\nend`;
            } else if(type === 'gui') {
                editor.value = `local ScreenGui = Instance.new("ScreenGui")\nlocal TextLabel = Instance.new("TextLabel")\nScreenGui.Parent = game.CoreGui\nTextLabel.Parent = ScreenGui\nTextLabel.Size = UDim2.new(0, 200, 0, 50)\nTextLabel.Position = UDim2.new(0.5, -100, 0.1, 0)\nTextLabel.Text = "Whitelist Onaylandı!"\nTextLabel.BackgroundColor3 = Color3.fromRGB(0, 200, 100)`;
            }
            showToast('Şablon Yüklendi!');
        }

        async function generateScript() {
            const rawScript = document.getElementById('rawScript').value.trim();
            const whitelistUsers = document.getElementById('whitelistUsers').value.split(',').map(u => u.trim()).filter(u => u.length > 0);
            const timeLock = document.getElementById('timeLock').value;
            const kickAction = document.getElementById('kickAction').value;
            const customNotify = document.getElementById('customNotify').value.trim();
            const obfuscate = document.getElementById('obfuscateCheck').checked;
            const usePcall = document.getElementById('pcallCheck').checked;

            if (!rawScript) {
                alert('Lütfen önce bir script girin!');
                return;
            }

            let expireTime = 0;
            const now = Date.now();
            if (timeLock === '1h') expireTime = now + (3600 * 1000);
            else if (timeLock === '24h') expireTime = now + (86400 * 1000);
            else if (timeLock === '7d') expireTime = now + (7 * 86400 * 1000);
            else if (timeLock === '30d') expireTime = now + (30 * 86400 * 1000);

            let wrappedLua = `-- Protected by Roblox Script Studio\n`;

            if (customNotify) {
                wrappedLua += `pcall(function()\n    game:GetService("StarterGui"):SetCore("SendNotification", {Title="Sistem", Text="${customNotify}"})\nend)\n\n`;
            }

            if (whitelistUsers.length > 0) {
                const usersLuaArray = whitelistUsers.map(u => `["${u.toLowerCase()}"] = true`).join(', ');
                wrappedLua += `local allowed = {${usersLuaArray}}\n`;
                wrappedLua += `local player = game:GetService("Players").LocalPlayer\n`;
                wrappedLua += `local pName = string.lower(player.Name)\n`;
                wrappedLua += `local pId = tostring(player.UserId)\n`;
                wrappedLua += `if not (allowed[pName] or allowed[pId]) then\n`;
                if (kickAction === 'kick') {
                    wrappedLua += `    player:Kick("Erişim Reddedildi: Whitelist listenizde yoksunuz!")\n`;
                } else if (kickAction === 'notify') {
                    wrappedLua += `    game:GetService("StarterGui"):SetCore("SendNotification", {Title="Hata", Text="Bu scripti kullanma izniniz yok!"})\n`;
                }
                wrappedLua += `    return\nend\n\n`;
            }

            if (expireTime > 0) {
                wrappedLua += `if os.time() * 1000 > ${expireTime} then\n`;
                wrappedLua += `    game:GetService("Players").LocalPlayer:Kick("Bu scriptin kullanım süresi dolmuştur!")\n`;
                wrappedLua += `    return\nend\n\n`;
            }

            if (usePcall) {
                wrappedLua += `pcall(function()\n${rawScript}\nend)`;
            } else {
                wrappedLua += rawScript;
            }

            if (obfuscate) {
                const encoded = btoa(unescape(encodeURIComponent(wrappedLua)));
                wrappedLua = `local b='${encoded}';local function d(s) local b='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/' s=string.gsub(s, '[^'..b..'=]', '') return (s:gsub('.', function(x) if (x == '=') then return '' end local r,f='',(b:find(x)-1) for i=6,1,-1 do r=r..(f%2^i>=2^(i-1) and 1 or 0) end return r end):gsub('%d%d%d%d%d%d%d%d', function(x) return string.char(tonumber(x,2)) end)) end; loadstring(d(b))()`;
            }

            try {
                showToast('RAW Yükleniyor...');
                const response = await fetch('https://dpaste.com/api/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        'content': wrappedLua,
                        'format': 'url',
                        'expiry_days': 7
                    })
                });

                if (response.ok) {
                    const pasteUrl = (await response.text()).trim();
                    const rawUrl = pasteUrl + '.txt';
                    
                    document.getElementById('rawUrlOutput').value = rawUrl;
                    document.getElementById('finalLoadstring').value = `loadstring(game:HttpGet("${rawUrl}"))()`;
                    showToast('Loadstring Hazır!');
                } else {
                    throw new Error('API Error');
                }
            } catch (err) {
                const encodedFallback = btoa(unescape(encodeURIComponent(wrappedLua)));
                const dataUrl = `loadstring(game:HttpGet("data:text/plain;base64,${encodedFallback}"))()`;
                document.getElementById('rawUrlOutput').value = "Yerel Bağlantı (Data Formatı)";
                document.getElementById('finalLoadstring').value = dataUrl;
                showToast('Loadstring Üretildi!');
            }
        }
    </script>
</body>
</html>
