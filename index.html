<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hesap Kontrolü</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Başlangıç Ekranı */
    .container {
      text-align: center;
    }

    .btn-check {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border: none;
      padding: 18px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-check:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(59, 130, 246, 0.6);
    }

    .btn-check:active {
      transform: translateY(0);
    }

    /* Tıklanınca Açılan Tam Ekran */
    #hacked-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .emoji {
      font-size: 12rem;
      line-height: 1;
      margin-bottom: 20px;
      animation: pulse 1s infinite alternate;
    }

    .message {
      font-size: 3rem;
      font-weight: 900;
      color: #ff0055;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(1.15);
      }
    }
  </style>
</head>
<body>

  <!-- Buton Alanı -->
  <div class="container" id="main-container">
    <button class="btn-check" onclick="showHacked()">KONTROL ET</button>
  </div>

  <!-- Şaka Ekranı -->
  <div id="hacked-screen">
    <div class="emoji">🖕</div>
    <div class="message">HESABIN ÇALINDI PEACH</div>
  </div>

  <script>
    function showHacked() {
      // Ana ekranı gizle
      document.getElementById('main-container').style.display = 'none';
      
      // Şaka ekranını tam ekran olarak göster
      const hackedScreen = document.getElementById('hacked-screen');
      hackedScreen.style.display = 'flex';
    }
  </script>

</body>
</html>
