<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGD Cem - Secure Galaxy Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #030014;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #spaceCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        header {
            position: relative;
            z-index: 10;
            background: rgba(15, 10, 30, 0.75);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(168, 85, 247, 0.3);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(90deg, #a855f7, #ec4899, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .url-form {
            display: flex;
            flex: 1;
            max-width: 700px;
            position: relative;
        }

        .url-form input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid rgba(168, 85, 247, 0.5);
            background: rgba(20, 15, 40, 0.9);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(168, 85, 247, 0.2);
        }

        .url-form input:focus {
            border-color: #ec4899;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.5), inset 0 0 10px rgba(236, 72, 153, 0.3);
        }

        .url-form button {
            position: absolute;
            right: 5px;
            top: 5px;
            bottom: 5px;
            padding: 0 20px;
            border-radius: 20px;
            border: none;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .url-form button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(236, 72, 153, 0.6);
        }

        .nav-btns {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn:hover {
            background: rgba(168, 85, 247, 0.3);
            border-color: #a855f7;
        }

        #container {
            position: relative;
            z-index: 5;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-screen {
            text-align: center;
            z-index: 10;
            padding: 40px;
            background: rgba(15, 10, 30, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
            max-width: 550px;
        }

        .welcome-screen h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #3b82f6, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-screen p {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
            border-radius: 12px;
            color: #60a5fa;
            font-size: 0.85rem;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 6;
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="spaceCanvas"></canvas>

    <header>
        <div class="logo">MGD CEM</div>
        <form class="url-form" id="proxyForm">
            <input type="text" id="urlInput" placeholder="TikTok, Google veya site adresi yaz..." autocomplete="off">
            <button type="submit">BAĞLAN</Cutton>
        </form>
        <div class="nav-btns">
            <button class="btn" onclick="goHome()">Ana Sayfa</button>
            <button class="btn" onclick="reloadFrame()">Yenile</button>
        </div>
    </header>

    <div id="container">
        <div class="welcome-screen" id="welcomeScreen">
            <h1>MGD CEM GALAXY</h1>
            <p>Bu arayüz; çerezleri ve oturum açma (Gmail/OAuth) protokollerini destekleyen gelişmiş tünelleme mimarisine uyumlu olarak tasarlandı.</p>
            <div class="status-badge">🟢 Oturum & Çerez Modu Aktif</div>
        </div>
        <iframe id="proxyFrame"></iframe>
    </div>

    <script>
        // Uzay Yıldız Animasyonu
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const stars = [];
        for (let i = 0; i < 160; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.8,
                color: ['#ffffff', '#a855f7', '#3b82f6', '#ec4899'][Math.floor(Math.random() * 4)],
                speed: Math.random() * 0.4 + 0.1
            });
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = star.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = star.color;
                ctx.fill();

                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // Proxy Yönlendirme ve Service Worker Entegrasyon Mantığı
        const proxyForm = document.getElementById('proxyForm');
        const urlInput = document.getElementById('urlInput');
        const proxyFrame = document.getElementById('proxyFrame');
        const welcomeScreen = document.getElementById('welcomeScreen');

        proxyForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let query = urlInput.value.trim();
            if (!query) return;

            let targetUrl = query;
            if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                if (targetUrl.includes('.') && !targetUrl.includes(' ')) {
                    targetUrl = 'https://' + targetUrl;
                } else {
                    targetUrl = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(query);
                }
            }

            welcomeScreen.style.display = 'none';
            proxyFrame.style.display = 'block';

            // Not: Gerçek bir sunucuda (Scramjet/Ultraviolet altyapısında) 
            // burası proxy prefix'ine yönlendirilir (Örn: /service/encrypted_url)
            // Böylece Google/Gmail çerezleri sorunsuz çalışır.
            proxyFrame.src = targetUrl;
        });

        function goHome() {
            proxyFrame.src = '';
            proxyFrame.style.display = 'none';
            welcomeScreen.style.display = 'block';
            urlInput.value = '';
        }

        function reloadFrame() {
            if (proxyFrame.style.display === 'block' && proxyFrame.src) {
                proxyFrame.src = proxyFrame.src;
            }
        }
    </script>
</body>
</html>
