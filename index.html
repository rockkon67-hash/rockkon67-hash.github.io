<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Boy Ali & Cem 👨‍❤️‍💋‍👨 Ali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #09090b;
            color: #ffffff;
            overflow: hidden;
            margin: 0;
            user-select: none;
        }

        /* Floating Background Text Styling & Animation */
        .floating-text {
            position: absolute;
            white-space: nowrap;
            font-weight: 900;
            color: rgba(245, 158, 11, 0.4);
            text-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
            pointer-events: none;
            will-change: transform, opacity;
            animation: floatMove linear infinite;
        }

        @keyframes floatMove {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(0.9);
                opacity: 0.2;
            }
            50% {
                opacity: 0.8;
                transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1.1);
            }
            100% {
                transform: translate(calc(var(--dx) * 2), calc(var(--dy) * 2)) rotate(calc(var(--rot) * 2)) scale(0.9);
                opacity: 0.2;
            }
        }

        /* Glow effects */
        .glow-gold {
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.6), 0 0 40px rgba(245, 158, 11, 0.3);
        }
        
        .glow-heart {
            text-shadow: 0 0 20px rgba(236, 72, 153, 0.7), 0 0 40px rgba(236, 72, 153, 0.4);
        }

        /* Custom Scrollbar for Phase 2 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(24, 24, 27, 0.8);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #ec4899;
            border-radius: 4px;
        }

        /* Pop in animation for 100 items */
        .pop-card {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.5);
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body class="h-screen w-screen relative flex items-center justify-center overflow-hidden">

    <!-- Background Container for Floating 'sigma boy ali 🤴' -->
    <div id="floatingBackground" class="absolute inset-0 z-0 overflow-hidden pointer-events-none"></div>

    <!-- Background Subtle Radial Gradient -->
    <div class="absolute inset-0 bg-radial from-amber-500/10 via-transparent to-black z-0 pointer-events-none"></div>

    <!-- PHASE 1: Countdown & Main Title -->
    <div id="phase1" class="relative z-10 flex flex-col items-center justify-center p-4 text-center">
        <!-- Main Card -->
        <div class="backdrop-blur-xl bg-zinc-900/80 border border-amber-500/40 rounded-3xl p-6 sm:p-10 shadow-[0_0_50px_rgba(245,158,11,0.2)] max-w-lg w-full mx-4 transform transition-all duration-300">
            
            <div class="text-6xl sm:text-7xl mb-4 animate-bounce">🤴</div>
            
            <h1 class="text-3xl sm:text-5xl font-black text-amber-400 mb-2 tracking-wider glow-gold">
                SIGMA BOY ALİ
            </h1>
            
            <p class="text-amber-200/80 font-bold mb-6 text-sm sm:text-base uppercase tracking-widest">
                Der Countdown läuft...
            </p>

            <!-- Countdown Timer Circle -->
            <div class="relative w-32 h-32 sm:w-40 sm:h-40 mx-auto flex items-center justify-center">
                <svg class="w-full h-full transform -rotate-90">
                    <circle cx="50%" cy="50%" r="42%" stroke="currentColor" stroke-width="8" class="text-zinc-800" fill="transparent" />
                    <circle id="timerProgress" cx="50%" cy="50%" r="42%" stroke="currentColor" stroke-width="8" class="text-amber-500 transition-all duration-1000 ease-linear" fill="transparent" stroke-dasharray="264" stroke-dashoffset="0" stroke-linecap="round" />
                </svg>
                <div class="absolute flex flex-col items-center">
                    <span id="countdownText" class="text-5xl sm:text-6xl font-black text-white glow-gold">10</span>
                    <span class="text-[10px] text-amber-400/80 font-semibold tracking-wider uppercase">Sekunden</span>
                </div>
            </div>

            <p class="mt-6 text-xs text-amber-400/90 font-mono tracking-widest uppercase animate-pulse">
                ⚡ Noch <span id="secondText" class="font-bold">10 Sekunden</span> verbleibend ⚡
            </p>
        </div>
    </div>

    <!-- PHASE 2: 100x Cem👨‍❤️‍💋‍👨Ali Display -->
    <div id="phase2" class="absolute inset-0 z-20 hidden bg-zinc-950 flex flex-col items-center justify-between p-4 sm:p-6">
        
        <!-- Header -->
        <div class="z-30 text-center pt-2 pb-4 w-full border-b border-pink-500/30 bg-zinc-950/90 backdrop-blur">
            <h2 class="text-2xl sm:text-4xl font-black tracking-wider text-pink-500 glow-heart mb-1">
                👨‍❤️‍💋‍👨 GROSSE LIEBE! 👨‍❤️‍💋‍👨
            </h2>
            <p class="text-xs sm:text-sm text-pink-300 font-semibold">
                100x cem👨‍❤️‍💋‍👨ali ist da!
            </p>
        </div>

        <!-- 100 Items Grid -->
        <div class="custom-scrollbar w-full max-w-6xl h-full overflow-y-auto my-4 p-2 sm:p-4">
            <div id="cemAliContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 text-center">
                <!-- Javascript injects 100 animated cards here -->
            </div>
        </div>

        <!-- Footer -->
        <div class="z-30 pb-2 pt-3 text-center w-full border-t border-pink-500/30 bg-zinc-950/90 backdrop-blur flex flex-col sm:flex-row items-center justify-center gap-4">
            <span class="text-pink-400 font-bold text-sm">🎉 Insgesamt 100 Mal geladen! 🎉</span>
            <button onclick="restartExperience()" class="px-6 py-2 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white font-black rounded-full shadow-lg shadow-pink-500/40 transition transform hover:scale-105 active:scale-95 text-xs sm:text-sm tracking-wider uppercase">
                Erneut starten 🔄
            </button>
        </div>
    </div>

    <script>
        // Web Audio API Beep Generator
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq = 440, duration = 0.08) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // Generate Continuously Floating 'sigma boy ali 🤴' background elements
        const bgContainer = document.getElementById('floatingBackground');
        const totalFloatingTexts = 35; // Total floating items across screen

        function generateFloatingBackground() {
            bgContainer.innerHTML = '';
            const phrases = [
                "sigma boy ali 🤴", 
                "SIGMA BOY ALİ 🤴", 
                "sigma boy ali 🤴", 
                "🤴 SIGMA BOY ALİ 🤴"
            ];

            for (let i = 0; i < totalFloatingTexts; i++) {
                const el = document.createElement('div');
                el.className = 'floating-text';
                
                // Pick random text phrase
                el.innerText = phrases[Math.floor(Math.random() * phrases.length)];
                
                // Random position across the entire viewport
                const startX = Math.random() * 100; // %
                const startY = Math.random() * 100; // %
                el.style.left = `${startX}vw`;
                el.style.top = `${startY}vh`;

                // Random font size
                const size = Math.floor(Math.random() * 18) + 16; // 16px to 34px
                el.style.fontSize = `${size}px`;

                // Set CSS variables for movement direction & distance
                const dx = (Math.random() - 0.5) * 300; // movement delta X
                const dy = (Math.random() - 0.5) * 300; // movement delta Y
                const rot = (Math.random() - 0.5) * 90;  // rotation in deg

                el.style.setProperty('--dx', `${dx}px`);
                el.style.setProperty('--dy', `${dy}px`);
                el.style.setProperty('--rot', `${rot}deg`);

                // Random animation duration & delay for seamless continuous floating
                const duration = Math.random() * 8 + 6; // 6s - 14s
                const delay = Math.random() * -10; // negative delay so they start immediately mid-animation
                el.style.animationDuration = `${duration}s`;
                el.style.animationDelay = `${delay}s`;

                bgContainer.appendChild(el);
            }
        }

        // Countdown Logic
        let timeLeft = 10;
        let countdownInterval = null;
        const countdownText = document.getElementById('countdownText');
        const secondText = document.getElementById('secondText');
        const timerProgress = document.getElementById('timerProgress');
        const fullDash = 264; // Circumference of circle

        function startCountdown() {
            timeLeft = 10;
            countdownText.innerText = timeLeft;
            secondText.innerText = `${timeLeft} Sekunden`;
            timerProgress.style.strokeDashoffset = '0';

            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                timeLeft--;
                playBeep(400 + (10 - timeLeft) * 40, 0.08);

                if (timeLeft >= 0) {
                    countdownText.innerText = timeLeft;
                    secondText.innerText = `${timeLeft} Sekunden`;
                    const offset = fullDash - (timeLeft / 10) * fullDash;
                    timerProgress.style.strokeDashoffset = offset;
                }

                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    switchToPhase2();
                }
            }, 1000);
        }

        // Phase 2: Render 100x cem👨‍❤️‍💋‍👨ali
        function switchToPhase2() {
            // Sound cue for phase change
            playBeep(880, 0.3);

            document.getElementById('phase1').classList.add('hidden');
            const phase2 = document.getElementById('phase2');
            phase2.classList.remove('hidden');

            const container = document.getElementById('cemAliContainer');
            container.innerHTML = '';

            // Generate 100 cards with staggered animations
            for (let i = 1; i <= 100; i++) {
                const card = document.createElement('div');
                card.className = 'pop-card bg-gradient-to-br from-pink-950/60 to-rose-900/40 border border-pink-500/40 rounded-2xl p-3 sm:p-4 flex items-center justify-between shadow-lg shadow-pink-950/50 hover:border-pink-400 hover:scale-105 transition-all';
                card.style.animationDelay = `${(i * 0.015).toFixed(2)}s`;

                card.innerHTML = `
                    <span class="text-xs font-mono font-bold text-pink-400 bg-pink-950/80 px-2 py-1 rounded-md border border-pink-500/30">#${i}</span>
                    <span class="text-sm sm:text-base font-black text-white tracking-wide drop-shadow">cem👨‍❤️‍💋‍👨ali</span>
                    <span class="text-xs opacity-75">💖</span>
                `;
                container.appendChild(card);
            }
        }

        function restartExperience() {
            document.getElementById('phase2').classList.add('hidden');
            document.getElementById('phase1').classList.remove('hidden');
            generateFloatingBackground();
            startCountdown();
        }

        // Initialize on page load
        window.onload = function() {
            generateFloatingBackground();
            startCountdown();
        };
    </script>
</body>
</html>
