<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CemTalk - Friends Chat</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --bg-chat: #0f172a;
            --bg-bubble-user: #2563eb;
            --bg-bubble-other: #334155;
            --primary: #3b82f6;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* GİRİŞ EKRANI */
        .auth-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .auth-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 32px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .auth-card h2 {
            margin-bottom: 6px;
            color: var(--primary);
            font-weight: 800;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .auth-input {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .error-msg {
            color: var(--accent-red);
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
        }

        /* SOL PANEL */
        .sidebar {
            width: 320px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .user-profile-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background: #111827;
        }

        .avatar-container { position: relative; }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
        }

        .status-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            background-color: var(--accent-green);
            border-radius: 50%;
            border: 2px solid var(--bg-panel);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .search-box {
            padding: 12px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-input-wrapper {
            flex: 1;
            background-color: #0f172a;
            border-radius: 20px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-color);
        }

        .search-input-wrapper input {
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            width: 100%;
            font-size: 0.85rem;
        }

        .btn-add-friend {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background-color: var(--primary);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .chat-item:hover, .chat-item.active {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .chat-item-info { flex: 1; overflow: hidden; }

        .chat-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .chat-name { font-weight: 600; font-size: 0.95rem; }
        .chat-id-tag { font-size: 0.75rem; color: #38bdf8; font-weight: bold; }

        .main-chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-chat);
            position: relative;
        }

        .chat-header {
            height: 68px;
            padding: 0 24px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-user { display: flex; align-items: center; gap: 12px; }

        .btn-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background-color: #334155;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .messages-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-bubble {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message-bubble.incoming {
            align-self: flex-start;
            background-color: var(--bg-bubble-other);
            border-bottom-left-radius: 4px;
        }

        .message-bubble.outgoing {
            align-self: flex-end;
            background-color: var(--bg-bubble-user);
            border-bottom-right-radius: 4px;
        }

        .message-time { font-size: 0.7rem; opacity: 0.7; margin-top: 4px; text-align: right; }

        .chat-input-area {
            padding: 16px 24px;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 12px 20px;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        /* MODAL VE PROFİL / AYARLAR PENCERESİ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 16px;
            width: 340px;
            text-align: center;
        }

        .profile-card {
            text-align: left;
        }

        .profile-avatar-large {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 0 auto 12px auto;
        }

        .setting-row {
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-select {
            background: #0f172a;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 8px;
            outline: none;
        }

        @media (max-width: 768px) {
            .sidebar { width: 100%; }
            .main-chat-area { display: none; }
        }
    </style>
</head>
<body>

    <!-- GİRİŞ / KAYIT EKRANI -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card">
            <h2>CemTalk</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">Secure Friends Chat</p>
            
            <div class="auth-tabs">
                <button class="tab-btn active" id="tabLoginBtn">Sign In</button>
                <button class="tab-btn" id="tabRegisterBtn">Sign Up</button>
            </div>

            <!-- GİRİŞ -->
            <form id="loginForm">
                <div class="form-group">
                    <label id="lbl-login-user">Username</label>
                    <input type="text" id="loginUsername" class="auth-input" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label id="lbl-login-pass">Password</label>
                    <input type="password" id="loginPassword" class="auth-input" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-submit" id="btn-login">Sign In</button>
            </form>

            <!-- KAYIT -->
            <form id="registerForm" style="display: none;">
                <div class="form-group">
                    <label id="lbl-reg-user">Choose Username</label>
                    <input type="text" id="regUsername" class="auth-input" placeholder="New username" required>
                </div>
                <div class="form-group">
                    <label>ID Number</label>
                    <input type="text" id="regUserId" class="auth-input" placeholder="e.g. 1024" required>
                </div>
                <div class="form-group">
                    <label id="lbl-reg-pass">Create Password</label>
                    <input type="password" id="regPassword" class="auth-input" placeholder="Create password" required>
                </div>
                <button type="submit" class="btn-submit" id="btn-register" style="background-color: var(--accent-green);">Create Account</button>
            </form>

            <div class="error-msg" id="errorMsg"></div>
        </div>
    </div>

    <!-- ARKADAŞ / İNSAN EKLEME MODALI (+ BUTONU) -->
    <div class="modal-overlay" id="addFriendModal">
        <div class="modal-card">
            <h3 style="margin-bottom: 12px;"><i class="fas fa-user-plus"></i> Add Friend</h3>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom: 14px;">Enter classmate's name and Id:</p>
            
            <input type="text" id="friendUsernameInput" class="auth-input" placeholder="Friend Username..." style="margin-bottom: 10px;">
            <input type="text" id="friendIdInput" class="auth-input" placeholder="Id (e.g. 1025)" style="margin-bottom: 14px;">
            
            <div style="display:flex; gap:10px;">
                <button onclick="closeAddFriendModal()" class="btn-submit" style="background:#334155; flex:1;">Cancel</button>
                <button onclick="confirmAddFriend()" class="btn-submit" style="flex:1;">Add</button>
            </div>
        </div>
    </div>

    <!-- PROFİL VE AYARLAR MODALI -->
    <div class="modal-overlay" id="profileSettingsModal">
        <div class="modal-card profile-card">
            <div class="profile-avatar-large" id="modalMyAvatar">?</div>
            <h3 style="text-align: center; margin-bottom: 4px;" id="modalMyName">User</h3>
            <p style="text-align: center; font-size:0.85rem; color:#38bdf8; font-weight: bold; margin-bottom: 16px;" id="modalMyId">Id: #0000</p>
            
            <hr style="border-color: var(--border-color); margin-bottom: 12px;">

            <h4><i class="fas fa-cog"></i> Settings</h4>
            
            <div class="setting-row">
                <span style="font-size: 0.9rem;">Language:</span>
                <select id="languageSelect" class="setting-select" onchange="changeLanguage(this.value)">
                    <option value="en" selected>English (EN)</option>
                    <option value="tr">Türkçe (TR)</option>
                    <option value="de">Deutsch (DE)</option>
                    <option value="es">Español (ES)</option>
                    <option value="fr">Français (FR)</option>
                    <option value="ru">Русский (RU)</option>
                    <option value="az">Azərbaycan (AZ)</option>
                </select>
            </div>

            <div style="display:flex; gap:10px; margin-top: 20px;">
                <button onclick="closeProfileSettingsModal()" class="btn-submit" style="background:#334155; flex:1;">Close</button>
                <button onclick="logout()" class="btn-submit" style="background:var(--accent-red); flex:1;">Logout</button>
            </div>
        </div>
    </div>

    <!-- SOL KENAR ÇUBUĞU -->
    <div class="sidebar">
        <div class="user-profile-header">
            <div style="display: flex; align-items: center; gap: 12px; cursor: pointer;" onclick="openProfileSettingsModal()">
                <div class="avatar-container">
                    <div class="avatar" id="myAvatar">?</div>
                    <div class="status-badge"></div>
                </div>
                <div>
                    <div style="font-weight: 600;" id="myProfileName">Guest</div>
                    <div style="font-size: 0.75rem; color: #38bdf8;" id="myProfileId">Id: #----</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon" title="Settings / Profile" onclick="openProfileSettingsModal()"><i class="fas fa-cog"></i></button>
            </div>
        </div>

        <!-- ARAMA & İNSAN EKLEME -->
        <div class="search-box">
            <div class="search-input-wrapper">
                <i class="fas fa-search" style="color: var(--text-muted);"></i>
                <input type="text" id="input-search" placeholder="Search friends...">
            </div>
            <button class="btn-add-friend" onclick="openAddFriendModal()" title="Add Friend (+)"><i class="fas fa-plus"></i></button>
        </div>

        <div class="chat-list" id="friendsChatList">
            <!-- Eklenen arkadaşlar buraya gelecek -->
        </div>
    </div>

    <!-- SOHBET ALANI -->
    <div class="main-chat-area">
        <div class="chat-header">
            <div class="chat-header-user">
                <div class="avatar" id="activeChatAvatar" style="background: #8b5cf6;">C</div>
                <div>
                    <div style="font-weight: 600;" id="activeChatName">Select a friend</div>
                    <div style="font-size: 0.75rem; color: #38bdf8;" id="activeChatId">Id: #----</div>
                </div>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="message-bubble incoming" id="txt-welcome-msg">
                Welcome to CemTalk! Add a classmate with the (+) button using their Name and Id to start chatting!
                <div class="message-time">12:00</div>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" class="chat-input" id="messageInput" placeholder="Type a message...">
            <button class="btn-icon" id="sendBtn" style="background-color: var(--primary);"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const translations = {
            en: { loginTab: "Sign In", regTab: "Sign Up", loginUserLbl: "Username", loginPassLbl: "Password", loginBtn: "Sign In", regUserLbl: "Choose Username", regPassLbl: "Create Password", regBtn: "Create Account", search: "Search friends...", welcome: "Welcome to CemTalk! Add a classmate with the (+) button using their Name and Id to start chatting!", typeMsg: "Type a message..." },
            tr: { loginTab: "Giriş Yap", regTab: "Kayıt Ol", loginUserLbl: "Kullanıcı Adı", loginPassLbl: "Şifre", loginBtn: "Giriş Yap", regUserLbl: "Kullanıcı Adı Seçin", regPassLbl: "Şifre Oluşturun", regBtn: "Hesap Oluştur", search: "Arkadaş ara...", welcome: "CemTalk'a hoş geldin! (+) butonuna basarak arkadaşının adını ve Id'sini ekle!", typeMsg: "Bir mesaj yazın..." }
        };

        function changeLanguage(lang) {
            const t = translations[lang] || translations['en'];
            document.getElementById('tabLoginBtn').innerText = t.loginTab;
            document.getElementById('tabRegisterBtn').innerText = t.regTab;
            document.getElementById('lbl-login-user').innerText = t.loginUserLbl;
            document.getElementById('lbl-login-pass').innerText = t.loginPassLbl;
            document.getElementById('btn-login').innerText = t.loginBtn;
            document.getElementById('lbl-reg-user').innerText = t.regUserLbl;
            document.getElementById('lbl-reg-pass').innerText = t.regPassLbl;
            document.getElementById('btn-register').innerText = t.regBtn;
            document.getElementById('input-search').placeholder = t.search;
            document.getElementById('messageInput').placeholder = t.typeMsg;
        }

        const authOverlay = document.getElementById('authOverlay');
        const tabLoginBtn = document.getElementById('tabLoginBtn');
        const tabRegisterBtn = document.getElementById('tabRegisterBtn');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const errorMsg = document.getElementById('errorMsg');

        const myProfileName = document.getElementById('myProfileName');
        const myProfileId = document.getElementById('myProfileId');
        const myAvatar = document.getElementById('myAvatar');

        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesContainer = document.getElementById('messagesContainer');
        const friendsChatList = document.getElementById('friendsChatList');

        let currentUser = null;
        let currentUserId = null;
        let friends = [
            { name: "Elif", id: "101" },
            { name: "Kaan", id: "102" }
        ];

        // Sekme Değiştirme
        tabLoginBtn.addEventListener('click', () => {
            tabLoginBtn.classList.add('active');
            tabRegisterBtn.classList.remove('active');
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
        });

        tabRegisterBtn.addEventListener('click', () => {
            tabRegisterBtn.classList.add('active');
            tabLoginBtn.classList.remove('active');
            registerForm.style.display = 'block';
            loginForm.style.display = 'none';
        });

        function showError(msg) {
            if (msg) {
                errorMsg.textContent = msg;
                errorMsg.style.display = 'block';
            } else { errorMsg.style.display = 'none'; }
        }

        // KAYIT
        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const userId = document.getElementById('regUserId').value.trim();
            const password = document.getElementById('regPassword').value;

            let users = JSON.parse(localStorage.getItem('cemtalk_users') || '{}');

            if (users[username]) {
                showError('Bu kullanıcı adı zaten alınmış!');
                return;
            }

            users[username] = { password: password, userId: userId };
            localStorage.setItem('cemtalk_users', JSON.stringify(users));

            alert('Hesap oluşturuldu! Giriş yapabilirsiniz.');
            tabLoginBtn.click();
            document.getElementById('loginUsername').value = username;
        });

        // GİRİŞ
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            let users = JSON.parse(localStorage.getItem('cemtalk_users') || '{}');

            if (!users[username] || users[username].password !== password) {
                showError('Kullanıcı adı veya şifre hatalı!');
                return;
            }

            currentUser = username;
            currentUserId = users[username].userId || '1000';
            
            myProfileName.textContent = currentUser;
            myProfileId.textContent = `Id: #${currentUserId}`;
            myAvatar.textContent = currentUser.substring(0, 2).toUpperCase();
            
            authOverlay.style.display = 'none';
            showError('');
            renderFriends();
        });

        function logout() {
            currentUser = null;
            closeProfileSettingsModal();
            authOverlay.style.display = 'flex';
        }

        // İNSAN EKLEME MODALI (+ BUTONU)
        function openAddFriendModal() {
            document.getElementById('addFriendModal').style.display = 'flex';
        }

        function closeAddFriendModal() {
            document.getElementById('addFriendModal').style.display = 'none';
            document.getElementById('friendUsernameInput').value = '';
            document.getElementById('friendIdInput').value = '';
        }

        function confirmAddFriend() {
            const nameInput = document.getElementById('friendUsernameInput').value.trim();
            const idInput = document.getElementById('friendIdInput').value.trim();

            if (nameInput && idInput) {
                friends.push({ name: nameInput, id: idInput });
                renderFriends();
                closeAddFriendModal();
            }
        }

        // PROFİL & AYARLAR MODALI
        function openProfileSettingsModal() {
            if(!currentUser) return;
            document.getElementById('modalMyName').innerText = currentUser;
            document.getElementById('modalMyId').innerText = `Id: #${currentUserId}`;
            document.getElementById('modalMyAvatar').innerText = currentUser.substring(0, 2).toUpperCase();
            document.getElementById('profileSettingsModal').style.display = 'flex';
        }

        function closeProfileSettingsModal() {
            document.getElementById('profileSettingsModal').style.display = 'none';
        }

        function renderFriends() {
            friendsChatList.innerHTML = '';
            friends.forEach(friend => {
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.onclick = () => selectFriend(friend.name, friend.id);
                item.innerHTML = `
                    <div class="avatar-container">
                        <div class="avatar" style="background: #3b82f6;">${friend.name.substring(0, 2).toUpperCase()}</div>
                        <div class="status-badge"></div>
                    </div>
                    <div class="chat-item-info">
                        <div class="chat-item-header">
                            <span class="chat-name">${friend.name}</span>
                            <span class="chat-id-tag">#${friend.id}</span>
                        </div>
                        <div style="font-size:0.8rem; color:var(--text-muted)">Online</div>
                    </div>
                `;
                friendsChatList.appendChild(item);
            });
        }

        function selectFriend(name, id) {
            document.getElementById('activeChatName').innerText = name;
            document.getElementById('activeChatId').innerText = `Id: #${id}`;
            document.getElementById('activeChatAvatar').innerText = name.substring(0, 2).toUpperCase();
        }

        // MESAJ GÖNDERME
        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '') return;

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message-bubble outgoing';
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            msgDiv.innerHTML = `${text}<div class="message-time">${time}</div>`;
            
            messagesContainer.appendChild(msgDiv);
            messageInput.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        renderFriends();
    </script>
</body>
</html>
