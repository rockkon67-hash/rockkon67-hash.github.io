<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmet Modu v3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Arka plan video alanı */
    .bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: 1;
      transform: translate(-50%, -50%);
      opacity: 0.4;
      object-fit: cover;
    }

    /* İçerik kartı */
    .card {
      position: relative;
      z-index: 2;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 550px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 71, 87, 0.5);
      border: 2px solid #ff4757;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      color: #ff4757;
      text-transform: uppercase;
    }

    .quote-box {
      font-size: 1.4rem;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    button {
      background-color: #ff4757;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .audio-notice {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <!-- Arka Plan Videosu -->
  <video class="bg-video" id="myVideo" loop muted playsinline>
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
  </video>

  <!-- Ses Dosyası (Sesi döngüye sokmak için loop eklendi) -->
  <audio id="myAudio" loop>
    <!-- Buraya kendi ses dosyanızın yolunu yazın -->
    <source src="ses.mp3" type="audio/mpeg">
  </audio>

  <div class="card">
    <h1>Ahmet Gerçekleri</h1>
    
    <div class="quote-box" id="quote">
      Başlatmak ve sesi açmak için butona tıklayın!
    </div>

    <button onclick="baslatVeDegistir()">Sesi Aç & Mesaj Değiştir</button>
    <div class="audio-notice">Tarayıcı kuralları gereği ses tıklama ile başlar.</div>
  </div>

  <script>
    const mesajlar = [
      "Ahmet yine oyunda 0/15/0 gidiyor...",
      "Ahmet salakça hareketlerde bugün yine bir numara!",
      "Ahmet tam bir noob, klavyeye basmayı yeni öğreniyor.",
      "Ahmet'in IQ seviyesi oda sıcaklığının altında.",
      "Ahmet yine yanlış oyunu indirdi...",
      "Ahmet'e oyunda yardım etmek imkansız bir görev.",
      "Ahmet tam bir profesyonel noob!",
      "Ahmet 'Start' düğmesini bulmak için 10 dakika harcadı."
    ];

    let basladi = false;

    function baslatVeDegistir() {
      const audio = document.getElementById('myAudio');
      const video = document.getElementById('myVideo');

      // İlk tıklamada ses ve videoyu başlat
      if (!basladi) {
        audio.play().catch(e => console.log("Ses oynatma hatası:", e));
        video.play();
        basladi = true;
      }

      // Rastgele mesaj seç
      const rastgeleIndex = Math.floor(Math.random() * mesajlar.length);
      document.getElementById('quote').innerText = mesajlar[rastgeleIndex];
    }
  </script>

</body>
</html>
