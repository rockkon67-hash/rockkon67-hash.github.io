<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGD Cem - Galaxy Web App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
      overflow-x: hidden;
    }

    /* Başlık Stili */
    header {
      margin-top: 20px;
      margin-bottom: 15px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 2px;
      color: #a855f7;
      text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7;
    }

    /* Arama / Adres Çubuğu Kutusu */
    .address-bar-container {
      display: flex;
      gap: 10px;
      width: 90%;
      max-width: 800px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 20px;
      border-radius: 25px;
      border: 2px solid #a855f7;
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.7);
    }

    button {
      padding: 12px 25px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(45deg, #a855f7, #6366f1);
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.8);
    }

    /* İçerik Ekranı (Iframe Penceresi) */
    .viewer-frame {
      width: 90%;
      max-width: 1200px;
      height: 70vh;
      border-radius: 15px;
      border: 2px solid rgba(168, 85, 247, 0.5);
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>MGD Cem</h1>
  </header>

  <div class="address-bar-container">
    <input type="text" id="urlInput" placeholder="Siti adresi yazın (Örn: wikipedia.org veya https://...)">
    <button onclick="loadSite()">Aç</button>
  </div>

  <div class="viewer-frame">
    <iframe id="siteViewer" src="about:blank"></iframe>
  </div>

  <script>
    function loadSite() {
      let input = document.getElementById('urlInput').value.trim();
      let iframe = document.getElementById('siteViewer');

      if (!input) return;

      // HTTP/HTTPS kontrolü
      if (!input.startsWith('http://') && !input.startsWith('https://')) {
        input = 'https://' + input;
      }

      iframe.src = input;
    }

    // Enter tuşuna basınca çalıştırma
    document.getElementById('urlInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        loadSite();
      }
    });
  </script>

</body>
</html>
