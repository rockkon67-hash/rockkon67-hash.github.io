<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmet'in Günlüğü</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2d2b55);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #ff4757;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .badge {
      display: inline-block;
      background-color: #ffa502;
      color: #000;
      font-weight: bold;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .quote-box {
      font-size: 1.5rem;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      border-left: 4px solid #ff4757;
    }

    button {
      background-color: #ff4757;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
    }

    button:hover {
      background-color: #ff6b81;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6);
    }

    button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Ahmet Anları</h1>
    <div class="badge">PRO NOOB</div>
    
    <div class="quote-box" id="quote">
      Yükleniyor...
    </div>

    <button onclick="yeniMesaj()">Başka Bir Gerçek</button>
  </div>

  <script>
    const mesajlar = [
      "Ahmet yine oyunda 0/15/0 gidiyor...",
      "Ahmet salakça hareketlerde bugün bir numara!",
      "Ahmet tam bir noob, klavyeye basmayı yeni öğreniyor.",
      "Ahmet'in IQ seviyesi oda sıcaklığının altında.",
      "Ahmet yine yanlış oyunu indirdi...",
      "Ahmet'e oyunda yardım etmek imkansız bir görev.",
      "Ahmet tam bir profesyonel noob!"
    ];

    function yeniMesaj() {
      const rastgele = Math.floor(Math.random() * mesajlar.length);
      document.getElementById('quote').innerText = mesajlar[rastgele];
    }

    // Sayfa açıldığında rastgele bir mesaj göster
    yeniMesaj();
  </script>

</body>
</html>
